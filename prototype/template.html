<title>Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@48,700,100,0&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width reading column. A card is a horizontal stack of slides, each in its own colour, which changes every day (palette() below). */
:root {
  --paper: #f4f5f2;
  --sheet: #ffffff;
  --ink: #1b1d22;
  --ink-soft: #565a63;
  --rule: #dcdfe0;
  --marker: #f5e36a;
  --marker-ink: #1b1d22;
  --s-hook: #2d3be8; --s-line: var(--l-line); --s-look: var(--l-look); --s-steal: var(--l-steal); --s-around: var(--l-around);
  --hook-ink: #fff4df; --hook-soft: rgba(255, 244, 223, .8); --hook-pill: #fff4df;
  --font-hook: "Fraunces", Georgia, serif;
  --font-line: "Literata", Georgia, "Times New Roman", serif;
  --font-note: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-tag: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111317; --sheet: #1a1d22; --ink: #e9e8e3; --ink-soft: #a2a5ab;
    --rule: #2c3036; --marker: #b9a63a; --marker-ink: #111317; color-scheme: dark;
    --s-line: var(--d-line); --s-look: var(--d-look); --s-steal: var(--d-steal); --s-around: var(--d-around);
  }
}
:root[data-theme="dark"] {
  --paper: #111317; --sheet: #1a1d22; --ink: #e9e8e3; --ink-soft: #a2a5ab;
  --rule: #2c3036; --marker: #b9a63a; --marker-ink: #111317; color-scheme: dark;
  --s-line: var(--d-line); --s-look: var(--d-look); --s-steal: var(--d-steal); --s-around: var(--d-around);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-note); font-size: 16px; line-height: 1.55;
  padding-inline: 16px; padding-block: 16px 28px;
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-tag); font-size: 12px; color: var(--ink-soft); letter-spacing: .04em; }
.top-title { font-weight: 700; color: var(--ink); letter-spacing: .08em; }

.modes { display: flex; gap: 3px; background: var(--sheet); padding: 3px; border: 1px solid var(--rule); border-radius: 99px; }
.mode-btn { font: 600 11px/1 var(--font-tag); letter-spacing: .03em; color: var(--ink-soft); background: none; border: 0; border-radius: 99px; padding: 6px 10px; cursor: pointer; transition: all .15s ease; }
.mode-btn[aria-pressed="true"] { color: var(--paper); background: var(--ink); }

.deck { min-width: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; overflow: hidden; }
.track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; padding: 26px 22px 22px; min-height: 480px; display: flex; flex-direction: column; gap: 16px; }

.slide.hook { background: var(--s-hook); color: var(--hook-ink); }
.slide.line-s { background: var(--s-line); }
.slide.look { background: var(--s-look); }
.slide.steal-s { background: var(--s-steal); }
.slide.around { background: var(--s-around); }
.pill { align-self: flex-start; font: 700 13px/1 var(--font-note); letter-spacing: .08em; text-transform: uppercase; background: var(--hook-pill); color: var(--s-hook); border-radius: 99px; padding: 7px 14px; }
.hook-title { font-family: var(--font-hook); font-weight: 700; font-variation-settings: "opsz" 48, "SOFT" 100, "WONK" 0; font-size: clamp(2.4rem, 12vw, 3.2rem); line-height: 1.04; letter-spacing: -.01em; text-wrap: balance; margin: auto 0; }
.hook-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 14px/1.2 var(--font-note); color: var(--hook-soft); }
.hook-foot span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hook-foot span:last-child { flex: none; }
.fine { font-size: 12px; font-style: italic; color: var(--ink-soft); margin-top: -10px; }
.job { font-family: var(--font-tag); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.line { white-space: pre-line; font-family: var(--font-line); font-size: 1.45rem; line-height: 1.42; text-wrap: pretty; margin: auto 0; }
.line.long { font-size: 1.2rem; }
.who { font-size: 14px; color: var(--ink-soft); }
.who cite { font-style: italic; color: var(--ink); }

.kicker { font-family: var(--font-tag); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.mini { white-space: pre-line; font-family: var(--font-line); font-size: 1rem; line-height: 1.5; color: var(--ink-soft); border-left: 2px solid var(--rule); padding-left: 12px; }
mark { background: linear-gradient(transparent 12%, var(--marker) 12%, var(--marker) 88%, transparent 88%); color: var(--marker-ink); padding: 0 2px; }
.note { font-size: 1.02rem; text-wrap: pretty; }
.note p { margin: 0; }
.note strong { font-weight: 600; }
mark.q { font-family: var(--font-line); font-style: italic; }

.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 12px 12px 14px; }
.dots button { font: 500 11px/1 var(--font-tag); letter-spacing: .04em; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 99px; padding: 6px 9px; white-space: nowrap; cursor: pointer; }
.dots button[aria-current="true"] { color: var(--ink); border-color: var(--ink); }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.nav button, .toggle { font: 500 14px/1 var(--font-note); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.nav button:disabled { opacity: .4; cursor: default; }
.count { font-family: var(--font-tag); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.widget-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.widget { background: var(--s-hook); color: var(--hook-ink); border-radius: 24px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; border: 0; text-align: left; font: inherit; }
.widget .wl { font-family: var(--font-hook); font-weight: 700; font-variation-settings: "opsz" 48, "SOFT" 100, "WONK" 0; font-size: 2rem; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.caption { font-size: 13px; color: var(--ink-soft); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Quote Bank Styles */
.bank-container { display: flex; flex-direction: column; gap: 14px; }
.bank-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.bank-views { display: flex; gap: 4px; }
.bank-btn { font: 500 12px/1 var(--font-note); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
.bank-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.bank-select { font: 500 12px/1 var(--font-tag); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; cursor: pointer; max-width: 140px; }

.bank-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 20px; padding: 26px 22px 22px; min-height: 440px; display: flex; flex-direction: column; gap: 16px; position: relative; }
.bank-hook-badge { align-self: flex-start; font: 600 12px/1 var(--font-tag); letter-spacing: .04em; text-transform: uppercase; background: var(--paper); color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 12px; }
.bank-quote { font-family: var(--font-line); font-size: 1.45rem; line-height: 1.42; margin: auto 0; text-wrap: pretty; color: var(--ink); }
.bank-quote.long { font-size: 1.2rem; }
.bank-insight { background: var(--paper); border-left: 3px solid var(--ink); border-radius: 6px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
.bank-insight strong { display: block; font-family: var(--font-tag); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin-bottom: 4px; }
.bank-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.bank-tag { font: 500 11px/1 var(--font-tag); background: var(--paper); color: var(--ink-soft); padding: 4px 8px; border-radius: 6px; }

.bank-shuffle-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn-surprise { font: 600 13px/1 var(--font-note); background: var(--ink); color: var(--paper); border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.btn-surprise:hover { opacity: .9; }

.bookshelf { display: flex; flex-direction: column; gap: 10px; }
.book-entry { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.book-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.book-header:hover { background: var(--paper); }
.book-title { font-family: var(--font-line); font-size: 1.05rem; font-weight: 600; color: var(--ink); }
.book-author { font-size: 13px; color: var(--ink-soft); }
.book-badge { font: 500 11px/1 var(--font-tag); background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 99px; padding: 4px 8px; }
.book-quotes { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--rule); margin-top: 4px; padding-top: 12px; }
.book-q-item { font-family: var(--font-line); font-size: 13.5px; line-height: 1.45; color: var(--ink); cursor: pointer; padding: 8px 10px; border-radius: 8px; background: var(--paper); }
.book-q-item:hover { background: var(--rule); }
.book-q-hook { font-family: var(--font-tag); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 2px; }

@media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <div class="top">
    <span class="top-title">MARGINALIA</span>
    <div class="modes">
      <button class="mode-btn" id="modeCards" aria-pressed="true">Cards (108)</button>
      <button class="mode-btn" id="modeBank" aria-pressed="false">Quote Bank (<span id="bankCountLabel">24</span>)</button>
    </div>
    <span id="day"></span>
  </div>

  <!-- VIEW 1: DAILY 5-SLIDE CARDS -->
  <main id="viewCards">
    <section class="deck" aria-label="Today's card">
      <div class="track" id="track"></div>
      <div class="dots" id="dots"></div>
    </section>

    <div class="nav" style="margin-top:14px">
      <button id="prev" type="button">← Previous</button>
      <span class="count" id="count"></span>
      <button id="next" type="button">Next →</button>
    </div>

    <div class="row" style="margin-top:12px">
      <span class="caption">Swipe sideways. Each slide is one step deeper.</span>
      <button class="toggle" id="stealToggle" type="button"></button>
    </div>

    <div class="widget-wrap">
      <span class="kicker">On your home screen</span>
      <button class="widget" id="widget" type="button" aria-label="Widget preview, opens the card">
        <span class="pill" id="wPill">How to</span>
        <span class="wl" id="wLine"></span>
        <span class="hook-foot" style="font-size:13px"><span id="wAuthor"></span><span>The line that does it →</span></span>
      </button>
      <span class="caption">Flick through every slide directly inside the Android widget on your phone.</span>
    </div>
  </main>

  <!-- VIEW 2: MASTER QUOTE BANK -->
  <main id="viewBank" class="bank-container" hidden>
    <div class="bank-toolbar">
      <div class="bank-views">
        <button class="bank-btn" id="bankViewShuffle" aria-pressed="true">🎲 Serendipity</button>
        <button class="bank-btn" id="bankViewShelf" aria-pressed="false">📚 Bookshelf</button>
      </div>
      <select class="bank-select" id="bankTagFilter" aria-label="Filter quotes by theme">
        <option value="">All themes</option>
      </select>
    </div>

    <!-- Shuffle Single Card View -->
    <div id="bankShufflePanel" style="display:flex; flex-direction:column; gap:14px">
      <article class="bank-card" id="bankCard">
        <div class="bank-hook-badge" id="bHook"></div>
        <p class="bank-quote" id="bQuote"></p>
        <div class="who" id="bWho"></div>
        <div class="bank-insight" id="bInsight">
          <strong>Craft Insight</strong>
          <span id="bWhy"></span>
        </div>
        <div class="bank-tags" id="bTags"></div>
      </article>

      <div class="bank-shuffle-nav">
        <button class="bank-btn" id="bPrev" type="button">← Prev</button>
        <button class="btn-surprise" id="bSurprise" type="button">Surprise Me 🎲</button>
        <button class="bank-btn" id="bNext" type="button">Next →</button>
      </div>
      <div style="text-align:center; font-size:12px; color:var(--ink-soft); font-family:var(--font-tag)" id="bCounter"></div>
    </div>

    <!-- Bookshelf Directory View -->
    <div id="bankShelfPanel" class="bookshelf" hidden>
      <!-- Injected via JS -->
    </div>
  </main>
</div>

<script>
const CARDS = /*CARDS*/[];
const QUOTE_BANK = /*QUOTE_BANK*/[];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const dayNumber = Math.floor(Date.now() / 86400000);

const HOOKS = ["#2d3be8", "#d9402a", "#1f6b45", "#7a2a7a", "#0f6e74", "#bf4a17", "#c21f6e", "#5b2bd9", "#14161b"];
const LIGHT = ["#ffe9a8", "#ffd0e1", "#d2f3b0", "#dcd0ff", "#ffd6bf", "#cde7ff", "#c4f0e0", "#f2e3c6", "#ffc2b8"];
const DARK = ["#5e460c", "#571f3b", "#1f4527", "#2e2870", "#6a2e14", "#173a5e", "#0f4a44", "#4a3524", "#6b1f2a"];
const seeded = seed => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const shuffled = (n, rand) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function palette(day) {
  const order = shuffled(HOOKS.length, seeded(Math.floor(day / HOOKS.length) * 7919 + 17));
  const picks = shuffled(LIGHT.length, seeded(day * 104729 + 3)).slice(0, 4);
  if (picks[1] === 0) [picks[0], picks[1]] = [picks[1], picks[0]];
  const root = document.documentElement.style;
  root.setProperty("--s-hook", HOOKS[order[((day % HOOKS.length) + HOOKS.length) % HOOKS.length]]);
  ["line", "look", "steal", "around"].forEach((k, i) => { root.setProperty(`--l-${k}`, LIGHT[picks[i]]); root.setProperty(`--d-${k}`, DARK[picks[i]]); });
}

const todayIndex = dayNumber % (CARDS.length || 1);
let index = todayIndex;
let showSteal = store.get("showSteal", true);

const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const note = s => {
  let h = md(s);
  const m = h.slice(12).search(/[.!?]”?\s/);
  if (m >= 0) { const end = 12 + m + (h[12 + m + 1] === "”" ? 2 : 1); h = "<strong>" + h.slice(0, end) + "</strong>" + h.slice(end); }
  return h.replace(/“([^”]{1,80})”/g, '<mark class="q">“$1”</mark>');
};

function marked(card) {
  let html = esc(card.quote);
  for (const h of card.highlights || []) {
    const e = esc(h);
    const i = html.indexOf(e);
    if (i >= 0) html = html.slice(0, i) + "<mark>" + e + "</mark>" + html.slice(i + e.length);
  }
  return html;
}

function credit(item) {
  return `${esc(item.author)}, <cite>${esc(item.work)}</cite>${item.translator ? ` · trans. ${esc(item.translator)}` : ""}`;
}

/* ==========================================================================
   CARDS RENDERER
   ========================================================================== */
function renderCards() {
  if (!CARDS.length) return;
  const c = CARDS[index];
  const howTo = c.job.startsWith("How to ");
  palette(dayNumber + index - todayIndex);
  const fine = `<div class="fine">${esc(c.job)}</div>`;
  const slides = [
    { tab: "How to", cls: "hook", html: `
      ${howTo ? '<span class="pill">How to</span>' : ""}
      <h2 class="hook-title">${esc(howTo ? c.job.slice(7) : c.job)}</h2>
      <div class="hook-foot"><span>${esc(c.author)}</span><span>The line that does it →</span></div>` },
    { tab: "The line", cls: "line-s", html: `
      <div class="kicker">The line</div>
      <p class="line${c.quote.length > 180 ? " long" : ""}">“${esc(c.quote)}”</p>
      <div class="who">${credit(c)}</div>${fine}` },
    { tab: "Look closer", cls: "look", html: `
      <div class="kicker">Look closer</div>
      <p class="mini">${marked(c)}</p>
      <div class="note"><p>${note(c.lookCloser)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` }
  ];
  if (showSteal) slides.push({ tab: "Steal it", cls: "steal-s", html: `
      <div class="kicker">Steal it</div>
      <div class="note"><p>${note(c.stealIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` });
  slides.push({ tab: "Around it", cls: "around", html: `
      <div class="kicker">Around it</div>
      <div class="note"><p>${note(c.aroundIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)} · ${c.year}</div>${fine}` });

  $("track").innerHTML = slides.map((s, i) => `<article class="slide ${s.cls}" aria-label="${s.tab}">${s.html}</article>`).join("");
  $("dots").innerHTML = slides.map((s, i) => `<button type="button" data-i="${i}" aria-current="${i === 0}">${s.tab}</button>`).join("");
  $("track").scrollLeft = 0;

  $("day").innerHTML = index === todayIndex ? "<b>TODAY</b>" : `CARD ${String(index + 1).padStart(2, "0")}`;
  $("count").textContent = `${index + 1} / ${CARDS.length}`;
  $("stealToggle").textContent = showSteal ? "Hide “Steal it”" : "Show “Steal it”";
  $("wPill").hidden = !howTo;
  $("wAuthor").textContent = c.author;
  $("wLine").textContent = howTo ? c.job.slice(7) : c.job;
}

/* ==========================================================================
   QUOTE BANK RENDERER
   ========================================================================== */
let bankFiltered = [...QUOTE_BANK];
let bankIndex = 0;

function initBank() {
  $("bankCountLabel").textContent = QUOTE_BANK.length;
  // Populate tags dropdown
  const tagSet = new Set();
  QUOTE_BANK.forEach(q => (q.tags || []).forEach(t => tagSet.add(t)));
  const tags = Array.from(tagSet).sort();
  $("bankTagFilter").innerHTML = `<option value="">All themes (${QUOTE_BANK.length})</option>` +
    tags.map(t => `<option value="${esc(t)}">#${esc(t)}</option>`).join("");

  renderBookshelf();
  filterBank();
}

function filterBank() {
  const selTag = $("bankTagFilter").value;
  if (!selTag) {
    bankFiltered = [...QUOTE_BANK];
  } else {
    bankFiltered = QUOTE_BANK.filter(q => (q.tags || []).includes(selTag));
  }
  bankIndex = 0;
  renderBankCard();
}

function renderBankCard() {
  if (!bankFiltered.length) {
    $("bHook").textContent = "EMPTY";
    $("bQuote").textContent = "No quotes match this filter.";
    $("bWho").textContent = "";
    $("bWhy").textContent = "";
    $("bTags").innerHTML = "";
    $("bCounter").textContent = "0 / 0";
    return;
  }
  const q = bankFiltered[bankIndex];
  $("bHook").textContent = q.hook || "Craft Job";
  $("bQuote").textContent = `“${q.quote}”`;
  $("bQuote").className = `bank-quote${q.quote.length > 180 ? " long" : ""}`;
  $("bWho").innerHTML = `${credit(q)}${q.year ? ` (${q.year})` : ""}`;
  $("bWhy").textContent = q.whyItLands || "";
  $("bTags").innerHTML = (q.tags || []).map(t => `<span class="bank-tag">#${esc(t)}</span>`).join("");
  $("bCounter").textContent = `${bankIndex + 1} of ${bankFiltered.length}`;
}

function renderBookshelf() {
  const shelf = $("bankShelfPanel");
  // Group by work
  const grouped = {};
  QUOTE_BANK.forEach(q => {
    const key = `${q.work}:::${q.author}:::${q.year || ""}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(q);
  });

  const keys = Object.keys(grouped).sort();
  shelf.innerHTML = keys.map((k, idx) => {
    const [work, author, year] = k.split(":::");
    const items = grouped[k];
    return `
      <div class="book-entry">
        <div class="book-header" onclick="toggleBook(${idx})">
          <div>
            <div class="book-title">${esc(work)}</div>
            <div class="book-author">${esc(author)}${year ? ` (${year})` : ""}</div>
          </div>
          <span class="book-badge">${items.length} quotes</span>
        </div>
        <div class="book-quotes" id="bookQ_${idx}" hidden>
          ${items.map(it => `
            <div class="book-q-item" onclick="openQuoteInShuffle('${esc(it.id)}')">
              <div class="book-q-hook">${esc(it.hook)}</div>
              <div>“${esc(it.quote.slice(0, 140))}${it.quote.length > 140 ? "..." : ""}”</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

window.toggleBook = function(idx) {
  const el = $(`bookQ_${idx}`);
  if (el) el.hidden = !el.hidden;
};

window.openQuoteInShuffle = function(id) {
  const foundIdx = bankFiltered.findIndex(q => q.id === id);
  if (foundIdx >= 0) {
    bankIndex = foundIdx;
  } else {
    $("bankTagFilter").value = "";
    filterBank();
    const allIdx = bankFiltered.findIndex(q => q.id === id);
    if (allIdx >= 0) bankIndex = allIdx;
  }
  // Switch to shuffle view
  $("bankViewShuffle").setAttribute("aria-pressed", "true");
  $("bankViewShelf").setAttribute("aria-pressed", "false");
  $("bankShufflePanel").hidden = false;
  $("bankShelfPanel").hidden = true;
  renderBankCard();
};

/* ==========================================================================
   EVENT LISTENERS
   ========================================================================== */
$("modeCards").addEventListener("click", () => {
  $("modeCards").setAttribute("aria-pressed", "true");
  $("modeBank").setAttribute("aria-pressed", "false");
  $("viewCards").hidden = false;
  $("viewBank").hidden = true;
  $("day").hidden = false;
});

$("modeBank").addEventListener("click", () => {
  $("modeCards").setAttribute("aria-pressed", "false");
  $("modeBank").setAttribute("aria-pressed", "true");
  $("viewCards").hidden = true;
  $("viewBank").hidden = false;
  $("day").hidden = true;
});

$("bankViewShuffle").addEventListener("click", () => {
  $("bankViewShuffle").setAttribute("aria-pressed", "true");
  $("bankViewShelf").setAttribute("aria-pressed", "false");
  $("bankShufflePanel").hidden = false;
  $("bankShelfPanel").hidden = true;
});

$("bankViewShelf").addEventListener("click", () => {
  $("bankViewShuffle").setAttribute("aria-pressed", "false");
  $("bankViewShelf").setAttribute("aria-pressed", "true");
  $("bankShufflePanel").hidden = true;
  $("bankShelfPanel").hidden = false;
});

$("bankTagFilter").addEventListener("change", filterBank);

$("bSurprise").addEventListener("click", () => {
  if (bankFiltered.length <= 1) return;
  let next;
  do {
    next = Math.floor(Math.random() * bankFiltered.length);
  } while (next === bankIndex);
  bankIndex = next;
  renderBankCard();
});

$("bNext").addEventListener("click", () => {
  if (!bankFiltered.length) return;
  bankIndex = (bankIndex + 1) % bankFiltered.length;
  renderBankCard();
});

$("bPrev").addEventListener("click", () => {
  if (!bankFiltered.length) return;
  bankIndex = (bankIndex - 1 + bankFiltered.length) % bankFiltered.length;
  renderBankCard();
});

// Keyboard shortcuts: Space for Surprise Me when Bank is visible
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if ($("viewBank").hidden === false && $("bankShufflePanel").hidden === false) {
    if (e.code === "Space") {
      e.preventDefault();
      $("bSurprise").click();
    } else if (e.code === "ArrowRight") {
      $("bNext").click();
    } else if (e.code === "ArrowLeft") {
      $("bPrev").click();
    }
  } else if ($("viewCards").hidden === false) {
    if (e.code === "ArrowRight") $("next").click();
    if (e.code === "ArrowLeft") $("prev").click();
  }
});

$("dots").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = $("track");
  t.scrollTo({ left: t.clientWidth * Number(b.dataset.i), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
$("track").addEventListener("scroll", () => {
  const t = $("track");
  const i = Math.round(t.scrollLeft / t.clientWidth);
  [...$("dots").children].forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
}, { passive: true });
$("prev").addEventListener("click", () => { index = (index - 1 + CARDS.length) % CARDS.length; renderCards(); });
$("next").addEventListener("click", () => { index = (index + 1) % CARDS.length; renderCards(); });
$("stealToggle").addEventListener("click", () => { showSteal = !showSteal; store.set("showSteal", showSteal); renderCards(); });
$("widget").addEventListener("click", () => { $("track").scrollLeft = 0; window.scrollTo({ top: 0, behavior: "smooth" }); });

renderCards();
initBank();
</script>
