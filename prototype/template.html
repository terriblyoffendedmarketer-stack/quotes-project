<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia Visual Studio — App Reader & Home Screen Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@48,700,100,0&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #f4f5f2;
  --sheet: #ffffff;
  --ink: #1b1d22;
  --ink-soft: #565a63;
  --rule: #dcdfe0;
  --marker: #f5e36a;
  --marker-ink: #1b1d22;
  --accent: #2d3be8;
  --spark-gold: #c98a00;
  --badge-bg: #e4e7eb;
  --badge-text: #1b1d22;
  --s-hook: #2d3be8; --s-line: var(--l-line); --s-look: var(--l-look); --s-steal: var(--l-steal); --s-around: var(--l-around);
  --hook-ink: #fff4df; --hook-soft: rgba(255, 244, 223, .8); --hook-pill: #fff4df;
  --font-hook: "Fraunces", Georgia, serif;
  --font-line: "Literata", Georgia, "Times New Roman", serif;
  --font-note: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-tag: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111317; --sheet: #1a1d22; --ink: #e9e8e3; --ink-soft: #a2a5ab;
    --rule: #2c3036; --marker: #b9a63a; --marker-ink: #111317; --accent: #6f80ff; --spark-gold: #f2ba42; color-scheme: dark;
    --badge-bg: #282d35; --badge-text: #f0efea;
    --s-line: var(--d-line); --s-look: var(--d-look); --s-steal: var(--d-steal); --s-around: var(--d-around);
  }
}
:root[data-theme="dark"] {
  --paper: #111317; --sheet: #1a1d22; --ink: #e9e8e3; --ink-soft: #a2a5ab;
  --rule: #2c3036; --marker: #b9a63a; --marker-ink: #111317; --accent: #6f80ff; --spark-gold: #f2ba42; color-scheme: dark;
  --badge-bg: #282d35; --badge-text: #f0efea;
  --s-line: var(--d-line); --s-look: var(--d-look); --s-steal: var(--d-steal); --s-around: var(--d-around);
}
:root[data-theme="light"] {
  --paper: #f4f5f2; --sheet: #ffffff; --ink: #1b1d22; --ink-soft: #565a63;
  --rule: #dcdfe0; --marker: #f5e36a; --marker-ink: #1b1d22; --accent: #2d3be8; --spark-gold: #c98a00; color-scheme: light;
  --badge-bg: #e4e7eb; --badge-text: #1b1d22;
  --s-line: var(--l-line); --s-look: var(--l-look); --s-steal: var(--l-steal); --s-around: var(--l-around);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-note); font-size: 16px; line-height: 1.55;
  padding-inline: 16px; padding-block: 16px 36px;
}
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* Studio Top Bar */
.studio-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.studio-brand { display: flex; align-items: baseline; gap: 6px; }
.studio-logo { font: 700 13px/1 var(--font-tag); letter-spacing: .08em; color: var(--ink); }
.studio-badge { font: 500 10px/1 var(--font-tag); background: var(--sheet); color: var(--ink-soft); border: 1px solid var(--rule); padding: 3px 6px; border-radius: 99px; }

.studio-tabs { display: flex; gap: 3px; background: var(--sheet); padding: 3px; border: 1px solid var(--rule); border-radius: 99px; }
.studio-tab { font: 600 11.5px/1 var(--font-tag); letter-spacing: .02em; color: var(--ink-soft); background: none; border: 0; border-radius: 99px; padding: 6px 12px; cursor: pointer; transition: all .15s ease; }
.studio-tab[aria-pressed="true"] { color: var(--paper); background: var(--ink); }

.theme-btn { font: 600 11px/1 var(--font-tag); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 10px; cursor: pointer; }

/* Phone Frame Mockup */
.phone-ui { display: flex; flex-direction: column; gap: 12px; width: 100%; }

.app-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 38px; }
.app-mode-toggle { display: flex; gap: 2px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 99px; padding: 2px; }
.app-mode-btn { font: 700 11.5px/1 var(--font-tag); padding: 6px 12px; border-radius: 99px; border: 0; background: none; color: var(--ink-soft); cursor: pointer; transition: all .15s; }
.app-mode-btn.active { background: var(--ink); color: var(--paper); }

.app-actions { display: flex; align-items: center; gap: 6px; }
.chip-btn { font: 600 11px/1 var(--font-tag); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 10px; cursor: pointer; }

/* Thematic Horizon Chips */
.horizons-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.horizons-bar::-webkit-scrollbar { display: none; }
.horizon-chip { font: 500 11px/1 var(--font-tag); background: var(--sheet); color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 10px; white-space: nowrap; cursor: pointer; transition: all .15s; }
.horizon-chip:hover { color: var(--ink); border-color: var(--ink-soft); }
.horizon-chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Card & Bank Deck */
.deck { min-width: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
.track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; padding: 26px 22px 22px; min-height: 480px; display: flex; flex-direction: column; gap: 16px; }

.slide.hook { background: var(--s-hook); color: var(--hook-ink); }
.slide.line-s { background: var(--s-line); }
.slide.look { background: var(--s-look); }
.slide.steal-s { background: var(--s-steal); }
.slide.around { background: var(--s-around); }
.slide.bank-line { background: var(--sheet); }
.slide.bank-context { background: var(--sheet); }

.pill { align-self: flex-start; font: 700 13px/1 var(--font-note); letter-spacing: .08em; text-transform: uppercase; background: var(--hook-pill); color: var(--s-hook); border-radius: 99px; padding: 7px 14px; }
.shelf-pill { align-self: flex-start; font: 700 11px/1 var(--font-note); letter-spacing: .08em; text-transform: uppercase; background: var(--badge-bg); color: var(--badge-text); border-radius: 99px; padding: 5px 12px; }

.hook-title { font-family: var(--font-hook); font-weight: 700; font-variation-settings: "opsz" 48, "SOFT" 100, "WONK" 0; font-size: clamp(2.4rem, 12vw, 3.2rem); line-height: 1.04; letter-spacing: -.01em; text-wrap: balance; margin: auto 0; }
.hook-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 14px/1.2 var(--font-note); color: var(--hook-soft); }
.hook-foot span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fine { font-size: 12px; font-style: italic; color: var(--ink-soft); margin-top: -10px; }
.job { font-family: var(--font-tag); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.line { white-space: pre-line; font-family: var(--font-line); font-size: 1.45rem; line-height: 1.42; text-wrap: pretty; margin: auto 0; }
.line.long { font-size: 1.2rem; }
.who { font-size: 13.5px; color: var(--ink-soft); }
.who cite { font-style: italic; color: var(--ink); font-weight: 500; }

.kicker { font-family: var(--font-tag); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.mini { white-space: pre-line; font-family: var(--font-line); font-size: 1rem; line-height: 1.5; color: var(--ink-soft); border-left: 2px solid var(--rule); padding-left: 12px; }
mark { background: linear-gradient(transparent 12%, var(--marker) 12%, var(--marker) 88%, transparent 88%); color: var(--marker-ink); padding: 0 2px; }
.note { font-size: 1.02rem; text-wrap: pretty; }
.note p { margin: 0; }
.note strong { font-weight: 600; }
mark.q { font-family: var(--font-line); font-style: italic; }

.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 12px 12px 14px; }
.dots button { font: 500 11px/1 var(--font-tag); letter-spacing: .04em; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 99px; padding: 6px 9px; white-space: nowrap; cursor: pointer; }
.dots button[aria-current="true"] { color: var(--ink); border-color: var(--ink); }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
.nav button, .toggle { font: 500 14px/1 var(--font-note); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.nav button:disabled { opacity: .4; cursor: default; }
.count { font-family: var(--font-tag); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ==========================================================================
   WIDGET SIMULATOR
   ========================================================================== */
.widget-sim-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 8px; }
.widget-device-bg {
  width: 100%; max-width: 420px;
  background: radial-gradient(circle at top right, #384252 0%, #1c212b 100%);
  border-radius: 36px; padding: 28px 20px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.25);
  display: flex; flex-direction: column; gap: 16px;
}
.widget-card-sim {
  border-radius: 24px; padding: 18px 20px 14px;
  min-height: 230px; display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; position: relative; overflow: hidden;
  box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  transition: all .2s ease;
  user-select: none;
}
.widget-card-sim.w-light { background: #f4f5f2; color: #14161b; }
.widget-card-sim.w-dark { background: #15171b; color: #f6f5f0; }

.w-badge-pill { font: 700 11px/1 var(--font-tag); letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 99px; align-self: flex-start; }
.widget-card-sim.w-light .w-badge-pill { background: #e4e7eb; color: #1b1d22; }
.widget-card-sim.w-dark .w-badge-pill { background: #282d35; color: #f0efea; }

.w-quote-text { font-family: var(--font-line); font-weight: 600; font-size: 1.25rem; line-height: 1.35; margin: 10px 0; }
.w-explanation-text { font-size: 0.95rem; line-height: 1.45; margin: 8px 0; flex: 1; display: flex; align-items: center; }

.w-sub { font-size: 12px; opacity: .7; }
.w-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; opacity: .85; border-top: 1px solid rgba(125,125,125,.15); padding-top: 8px; }
.w-btn { font: 600 12px/1 var(--font-tag); background: none; border: 0; color: inherit; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.w-btn:hover { background: rgba(125,125,125,.15); }

/* ==========================================================================
   CATALOG HORIZONS STREAM
   ========================================================================== */
.bank-container { display: flex; flex-direction: column; gap: 16px; }
.bank-header-panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-input { flex: 1; font: 500 14px/1.4 var(--font-note); background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; outline: none; transition: border-color .15s; }
.search-input:focus { border-color: var(--ink); }
.filter-active-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
.active-tag-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--paper); font: 500 11px/1 var(--font-tag); padding: 4px 10px; border-radius: 99px; }
.active-tag-pill button { background: none; border: 0; color: var(--paper); cursor: pointer; padding: 0; font-weight: bold; font-size: 13px; line-height: 1; }
.spark-queue-btn { font: 600 11px/1 var(--font-tag); background: var(--paper); color: var(--spark-gold); border: 1px solid var(--rule); border-radius: 99px; padding: 5px 9px; cursor: pointer; }
.spark-queue-btn[aria-pressed="true"] { background: var(--spark-gold); color: #fff; border-color: var(--spark-gold); }

.horizon-section { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.horizon-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-top: 14px; }
.horizon-title { font-family: var(--font-tag); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.horizon-count { font-family: var(--font-tag); font-size: 11px; color: var(--ink-soft); }

.quote-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; transition: border-color .15s, box-shadow .15s; }
.quote-card:hover { border-color: var(--ink-soft); }
.quote-card.spark-highlight { border-color: var(--spark-gold); box-shadow: 0 0 0 1px var(--spark-gold); }
.qc-quote { font-family: var(--font-line); font-size: 1.35rem; line-height: 1.44; margin: 0; color: var(--ink); text-wrap: pretty; }
.qc-quote.long { font-size: 1.15rem; }
.qc-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-soft); }
.qc-book { font-weight: 600; color: var(--ink); font-family: var(--font-line); }
.qc-explanation { background: var(--paper); border-left: 3px solid var(--accent); border-radius: 6px; padding: 11px 13px; font-size: 13.5px; line-height: 1.48; color: var(--ink); }
.qc-explanation-label { font-family: var(--font-tag); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 600; margin-bottom: 3px; display: block; }
.qc-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.qc-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.qc-tag { font: 500 10.5px/1 var(--font-tag); background: var(--paper); color: var(--ink-soft); padding: 4px 7px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
.qc-tag:hover { color: var(--ink); border-color: var(--rule); }

.btn-spark { font: 600 11.5px/1 var(--font-tag); background: transparent; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all .15s; }
.btn-spark:hover { color: var(--spark-gold); border-color: var(--spark-gold); }
.btn-spark.saved { background: var(--paper); color: var(--spark-gold); border-color: var(--spark-gold); }
.load-more-wrap { text-align: center; padding: 18px 0; }
.btn-load-more { font: 600 13px/1 var(--font-note); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 11px 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Top Studio Header -->
  <header class="studio-bar">
    <div class="studio-brand">
      <span class="studio-logo">MARGINALIA</span>
      <span class="studio-badge">Visual Studio</span>
    </div>
    <nav class="studio-tabs" aria-label="Visual Studio Views">
      <button class="studio-tab" id="studioTabApp" aria-pressed="true">📱 App Reader</button>
      <button class="studio-tab" id="studioTabWidget" aria-pressed="false">🔲 Widget</button>
      <button class="studio-tab" id="studioTabCatalog" aria-pressed="false">📚 Catalog</button>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button">🌙 Dark</button>
  </header>

  <!-- VIEW 1: PHONE APP SIMULATOR -->
  <main id="viewApp" class="phone-ui">
    <div class="app-header">
      <div class="app-mode-toggle">
        <button class="app-mode-btn active" id="appModeCards" type="button">Daily Cards</button>
        <button class="app-mode-btn" id="appModeBank" type="button">Quote Bank</button>
      </div>
      <div class="app-actions">
        <button class="chip-btn" id="appBtnSurprise" type="button" style="display:none">🎲 Surprise</button>
        <button class="chip-btn" id="appDayLabel" type="button">TODAY</button>
      </div>
    </div>

    <!-- Horizons row in Quote Bank mode -->
    <nav class="horizons-bar" id="appHorizonsBar" style="display:none" aria-label="Thematic Horizons">
      <button class="horizon-chip" data-h="all" aria-pressed="true">All (1,871)</button>
      <button class="horizon-chip" data-h="dread" aria-pressed="false">Dread</button>
      <button class="horizon-chip" data-h="folly" aria-pressed="false">Folly</button>
      <button class="horizon-chip" data-h="solitude" aria-pressed="false">Solitude</button>
      <button class="horizon-chip" data-h="stakes" aria-pressed="false">High Stakes</button>
      <button class="horizon-chip" data-h="irony" aria-pressed="false">Irony</button>
      <button class="horizon-chip" data-h="power" aria-pressed="false">Power & History</button>
      <button class="horizon-chip" data-h="prose" aria-pressed="false">Prose</button>
    </nav>

    <!-- App Card / Bank Deck -->
    <section class="deck" id="appDeck" aria-label="Reading Deck">
      <div class="track" id="track"></div>
      <div class="dots" id="dots"></div>
    </section>

    <!-- Navigation Bar -->
    <div class="nav">
      <button id="prev" type="button">← Previous</button>
      <span class="count" id="count"></span>
      <button id="next" type="button">Next →</button>
    </div>

    <div class="nav" style="justify-content: flex-end; margin-top: -2px;">
      <button class="toggle" id="stealToggle" type="button"></button>
    </div>
  </main>

  <!-- VIEW 2: HOME SCREEN WIDGET SIMULATOR -->
  <main id="viewWidget" class="widget-sim-wrap" hidden>
    <div style="display:flex; justify-content:space-between; width:100%; max-width:420px; align-items:center;">
      <span class="kicker">Android Home Screen 4×2 Widget</span>
      <button class="chip-btn" id="wThemeToggle" type="button">Theme: Dark</button>
    </div>

    <div class="widget-device-bg">
      <div class="widget-card-sim w-dark" id="widgetSimCard">
        <!-- Content injected by JS -->
      </div>
    </div>

    <span class="fine" style="text-align:center; max-width:380px;">
      Tap right on the widget to reveal the complete <strong>Scene Context</strong>. Tap <strong>[ ⇄ ]</strong> to toggle between Craft Card and Shelf Spark. Tap <strong>Open ↗</strong> to jump straight into the app.
    </span>
  </main>

  <!-- VIEW 3: FULL HORIZONS CATALOG -->
  <main id="viewCatalog" class="bank-container" hidden>
    <section class="bank-header-panel">
      <div class="search-row">
        <input type="text" class="search-input" id="bankSearch" placeholder="Search 1,871 quotes, authors, books..." autocomplete="off">
        <button class="chip-btn" id="btnSurpriseCatalog" type="button">🎲 Surprise</button>
      </div>

      <nav class="horizons-bar" id="catalogHorizonsBar" aria-label="Thematic Horizons">
        <button class="horizon-chip" data-h="all" aria-pressed="true">All (1,871)</button>
        <button class="horizon-chip" data-h="dread" aria-pressed="false">Atmospheric Dread</button>
        <button class="horizon-chip" data-h="folly" aria-pressed="false">Human Folly</button>
        <button class="horizon-chip" data-h="solitude" aria-pressed="false">Solitude & Finitude</button>
        <button class="horizon-chip" data-h="stakes" aria-pressed="false">High Stakes</button>
        <button class="horizon-chip" data-h="irony" aria-pressed="false">Sharp Irony</button>
        <button class="horizon-chip" data-h="power" aria-pressed="false">Power & History</button>
        <button class="horizon-chip" data-h="prose" aria-pressed="false">Observation & Prose</button>
      </nav>

      <div class="filter-active-row">
        <div>
          <span id="bankMatchCount">1,871</span> quotes across <span id="bankBooksCount">416</span> books
          <span id="activeTagContainer" style="margin-left:8px; display:none">
            <span class="active-tag-pill">#<span id="activeTagName"></span> <button id="btnClearTag" type="button">×</button></span>
          </span>
        </div>
        <button class="spark-queue-btn" id="btnSparkQueue" type="button" aria-pressed="false">✨ Read Next Queue (<span id="sparkQueueCount">0</span>)</button>
      </div>
    </section>

    <div id="quotesStream" class="quotes-stream"></div>

    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="btn-load-more" id="btnLoadMore" type="button">Load More Quotes ↓</button>
    </div>
  </main>
</div>

<script>
const CARDS = /*CARDS*/[];
const QUOTE_BANK = /*QUOTE_BANK*/[];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const $ = id => document.getElementById(id);

/* ==========================================================================
   PALETTES FOR CRAFT CARDS
   ========================================================================== */
const HOOKS = ["#2d3be8", "#d9402a", "#1f6b45", "#7a2a7a", "#0f6e74", "#bf4a17", "#c21f6e", "#5b2bd9", "#14161b"];
const LIGHT = ["#ffe9a8", "#ffd0e1", "#d2f3b0", "#dcd0ff", "#ffd6bf", "#cde7ff", "#c4f0e0", "#f2e3c6", "#ffc2b8"];
const DARK = ["#5e460c", "#571f3b", "#1f4527", "#2e2870", "#6a2e14", "#173a5e", "#0f4a44", "#4a3524", "#6b1f2a"];

function paletteFor(day) {
  let h = Math.abs(Number(day)) || 0;
  const hook = HOOKS[h % HOOKS.length];
  const l = [LIGHT[h % LIGHT.length], LIGHT[(h + 2) % LIGHT.length], LIGHT[(h + 4) % LIGHT.length], LIGHT[(h + 6) % LIGHT.length]];
  const d = [DARK[h % DARK.length], DARK[(h + 2) % DARK.length], DARK[(h + 4) % DARK.length], DARK[(h + 6) % DARK.length]];
  return { hook, light: l, dark: d };
}

/* ==========================================================================
   THEMES & HORIZONS ENGINE
   ========================================================================== */
const THEMES = [
  { code: "dread", title: "Atmospheric Dread", kw: new Set(["dread", "horror", "fear", "death", "dark", "eerie", "uncanny", "haunting", "tension", "macabre", "grotesque"]) },
  { code: "folly", title: "Human Folly", kw: new Set(["folly", "vanity", "satire", "hypocrisy", "manners", "social", "pretension", "awkwardness", "family", "prejudice", "pride"]) },
  { code: "solitude", title: "Solitude & Finitude", kw: new Set(["solitude", "stillness", "time", "silence", "memory", "grief", "mortality", "loss", "longing", "reflection", "quiet", "finitude", "loneliness"]) },
  { code: "stakes", title: "High Stakes", kw: new Set(["stakes", "high-stakes", "choice", "sacrifice", "survival", "courage", "crisis", "danger", "pressure", "willpower", "duty", "moral"]) },
  { code: "irony", title: "Sharp Irony", kw: new Set(["irony", "dark-humor", "humor", "wit", "cynicism", "absurdity", "paradox", "comedy", "dry", "understatement", "wry"]) },
  { code: "power", title: "Power & History", kw: new Set(["power", "history", "politics", "empire", "systems", "bureaucracy", "control", "civilization", "war", "ideology", "propaganda"]) },
  { code: "prose", title: "Observation & Prose", kw: new Set(["observation", "prose", "rhythm", "sensory-detail", "detail", "voice"]) }
];

// Pre-assign horizons
QUOTE_BANK.forEach(q => {
  const tags = new Set(q.tags || []);
  const text = (q.quote + " " + (q.explanation || "")).toLowerCase();
  for (const t of THEMES) {
    if (tags.size && [...tags].some(tag => t.kw.has(tag))) {
      q.horizon = t.code;
      return;
    }
  }
  for (const t of THEMES) {
    for (const w of t.kw) {
      if (text.includes(w)) {
        q.horizon = t.code;
        return;
      }
    }
  }
  q.horizon = "prose";
});

/* ==========================================================================
   APP READER STATE & ENGINE
   ========================================================================== */
let appMode = "cards"; // "cards" | "bank"
let cardIndex = 0;
let bankIndex = 0;
let appHorizon = "all";
let showSteal = store.get("showSteal", true);

function getAppBankQuotes() {
  if (appHorizon === "all") return QUOTE_BANK;
  return QUOTE_BANK.filter(q => q.horizon === appHorizon);
}

function renderApp() {
  const isCards = appMode === "cards";
  $("appModeCards").classList.toggle("active", isCards);
  $("appModeBank").classList.toggle("active", !isCards);
  $("appBtnSurprise").style.display = isCards ? "none" : "block";
  $("appHorizonsBar").style.display = isCards ? "none" : "flex";
  $("stealToggle").style.display = isCards ? "block" : "none";

  if (isCards) {
    renderCardDeck();
  } else {
    renderBankDeck();
  }
}

function renderCardDeck() {
  const card = CARDS[cardIndex];
  const p = paletteFor(cardIndex);
  document.documentElement.style.setProperty("--s-hook", p.hook);
  document.documentElement.style.setProperty("--l-line", p.light[0]);
  document.documentElement.style.setProperty("--l-look", p.light[1]);
  document.documentElement.style.setProperty("--l-steal", p.light[2]);
  document.documentElement.style.setProperty("--l-around", p.light[3]);
  document.documentElement.style.setProperty("--d-line", p.dark[0]);
  document.documentElement.style.setProperty("--d-look", p.dark[1]);
  document.documentElement.style.setProperty("--d-steal", p.dark[2]);
  document.documentElement.style.setProperty("--d-around", p.dark[3]);

  const hasHowTo = Boolean(card.hook && card.hook.trim());
  const slides = [
    {
      cls: "hook",
      html: `
        ${hasHowTo ? `<span class="pill">How to</span>` : ``}
        <h1 class="hook-title">${escapeHtml(card.hook || card.quote)}</h1>
        <div class="hook-foot"><span>${escapeHtml(card.author)}</span><span>The line that does it →</span></div>
      `
    },
    {
      cls: "line-s",
      html: `
        <span class="kicker">The line</span>
        <div class="line ${card.quote.length > 220 ? 'long' : ''}">“${escapeHtml(card.quote)}”</div>
        <div class="who">${escapeHtml(card.author)}, <cite>${escapeHtml(card.work)}</cite></div>
        <div class="job">${escapeHtml(card.job)}</div>
      `
    },
    {
      cls: "look",
      html: `
        <span class="kicker">Look closer</span>
        <div class="mini">${highlightQuote(card)}</div>
        <div class="note"><p>${escapeHtml(card.lookCloser)}</p></div>
        <div class="who">${escapeHtml(card.author)}, <cite>${escapeHtml(card.work)}</cite></div>
        <div class="job">${escapeHtml(card.job)}</div>
      `
    }
  ];

  if (showSteal && card.stealIt) {
    slides.push({
      cls: "steal-s",
      html: `
        <span class="kicker">Steal it</span>
        <div class="note"><p>${escapeHtml(card.stealIt)}</p></div>
        <div class="who">${escapeHtml(card.author)}, <cite>${escapeHtml(card.work)}</cite></div>
        <div class="job">${escapeHtml(card.job)}</div>
      `
    });
  }

  slides.push({
    cls: "around",
    html: `
      <span class="kicker">Around it</span>
      <div class="note"><p>${escapeHtml(card.aroundIt)}</p></div>
      <div class="who">${escapeHtml(card.author)}, <cite>${escapeHtml(card.work)}</cite>${card.year ? ` · ${card.year}` : ''}</div>
      <div class="job">${escapeHtml(card.job)}</div>
    `
  });

  const track = $("track");
  track.innerHTML = slides.map(s => `<div class="slide ${s.cls}">${s.html}</div>`).join("");

  const labels = ["How to", "The line", "Look closer"];
  if (showSteal && card.stealIt) labels.push("Steal it");
  labels.push("Around it");
  $("dots").innerHTML = labels.map((l, i) => `<button type="button" data-i="${i}" aria-current="${i === 0}">${l}</button>`).join("");

  $("count").textContent = `Card ${cardIndex + 1} of ${CARDS.length}`;
  $("stealToggle").textContent = showSteal ? "Hide 'Steal it'" : "Show 'Steal it'";
  $("appDayLabel").textContent = cardIndex === 0 ? "TODAY" : "← TODAY";
  track.scrollLeft = 0;
}

function renderBankDeck() {
  const quotes = getAppBankQuotes();
  if (!quotes.length) return;
  bankIndex = Math.min(bankIndex, quotes.length - 1);
  const q = quotes[bankIndex];

  const slides = [
    {
      cls: "bank-line",
      html: `
        <span class="shelf-pill">SHELF SPARK</span>
        <span class="kicker">${escapeHtml(q.work)}</span>
        <div class="line ${q.quote.length > 220 ? 'long' : ''}">“${escapeHtml(q.quote)}”</div>
        <div class="who">${escapeHtml(q.author)}, <cite>${escapeHtml(q.work)}</cite>${q.year ? ` · ${q.year}` : ''}</div>
        <div class="job">#${escapeHtml(q.horizon)} ${q.tags ? q.tags.map(t => `#${t}`).join(' ') : ''}</div>
      `
    },
    {
      cls: "bank-context",
      html: `
        <span class="shelf-pill">SCENE CONTEXT</span>
        <span class="kicker">${escapeHtml(q.work)}</span>
        <div class="note" style="font-size:1.15rem; line-height:1.6; margin: auto 0;"><p>${escapeHtml(q.explanation)}</p></div>
        <div class="who">${escapeHtml(q.author)}, <cite>${escapeHtml(q.work)}</cite></div>
        <div class="job">#${escapeHtml(q.horizon)} ${q.tags ? q.tags.map(t => `#${t}`).join(' ') : ''}</div>
      `
    }
  ];

  const track = $("track");
  track.innerHTML = slides.map(s => `<div class="slide ${s.cls}">${s.html}</div>`).join("");
  $("dots").innerHTML = `
    <button type="button" data-i="0" aria-current="true">The Line</button>
    <button type="button" data-i="1" aria-current="false">Scene Context</button>
  `;

  const hName = THEMES.find(t => t.code === appHorizon)?.title || "All";
  $("count").textContent = `${bankIndex + 1} / ${quotes.length} · ${hName}`;
  $("appDayLabel").textContent = "TODAY";
  track.scrollLeft = 0;
}

// Widget card tap to step slides
$("widgetSimCard").addEventListener("click", e => {
  const rect = $("widgetSimCard").getBoundingClientRect();
  const x = e.clientX - rect.left;
  const isBack = x < rect.width * 0.35;

  if (widgetMode === "shelf") {
    // In Shelf Spark mode, tapping forward flips between Line and Context
    if (isBack) {
      widgetShelfSlide = 0;
    } else {
      widgetShelfSlide = widgetShelfSlide === 0 ? 1 : 0;
    }
  } else {
    // In Craft Cards mode, step slides
    if (isBack) {
      widgetCardSlide = Math.max(0, widgetCardSlide - 1);
    } else {
      widgetCardSlide = (widgetCardSlide + 1) % 5;
    }
  }
  renderWidget();
});

$("wThemeToggle").addEventListener("click", () => {
  widgetTheme = widgetTheme === "dark" ? "light" : "dark";
  renderWidget();
});

/* ==========================================================================
   CATALOG HORIZONS STREAM ENGINE
   ========================================================================== */
let bankQuery = "";
let bankActiveHorizon = "all";
let bankActiveTag = null;
let bankShowingSparkQueue = false;
let sparkQueue = store.get("sparkQueue", []);
let renderedCount = 0;
const PAGE_SIZE = 25;
let currentFilteredList = [];

function getFilteredBank() {
  return QUOTE_BANK.filter(q => {
    if (bankShowingSparkQueue && !sparkQueue.includes(q.work)) return false;
    if (bankActiveHorizon !== "all" && q.horizon !== bankActiveHorizon) return false;
    if (bankActiveTag && !(q.tags || []).includes(bankActiveTag)) return false;
    if (bankQuery) {
      const hay = (q.quote + " " + q.author + " " + q.work + " " + (q.explanation || "") + " " + (q.tags || []).join(" ")).toLowerCase();
      if (!hay.includes(bankQuery.toLowerCase())) return false;
    }
    return true;
  });
}

function renderBankStream(reset = false) {
  if (reset) {
    renderedCount = 0;
    $("quotesStream").innerHTML = "";
    currentFilteredList = getFilteredBank();
    $("bankMatchCount").textContent = currentFilteredList.length.toLocaleString();
    const books = new Set(currentFilteredList.map(q => q.work));
    $("bankBooksCount").textContent = books.size.toLocaleString();
  }

  const slice = currentFilteredList.slice(renderedCount, renderedCount + PAGE_SIZE);
  if (!slice.length) {
    if (reset) $("quotesStream").innerHTML = `<div style="text-align:center; padding:40px; color:var(--ink-soft);">No quotes match your filter.</div>`;
    $("loadMoreWrap").style.display = "none";
    return;
  }

  const html = slice.map(q => {
    const isSaved = sparkQueue.includes(q.work);
    return `
      <article class="quote-card" data-work="${escapeHtml(q.work)}">
        <blockquote class="qc-quote ${q.quote.length > 220 ? 'long' : ''}">“${escapeHtml(q.quote)}”</blockquote>
        <div class="qc-meta">
          <span class="qc-book">${escapeHtml(q.work)}</span>
          <span>— ${escapeHtml(q.author)}${q.year ? ` · ${q.year}` : ''}</span>
        </div>
        ${q.explanation ? `
          <div class="qc-explanation">
            <span class="qc-explanation-label">Scene Context</span>
            ${escapeHtml(q.explanation)}
          </div>
        ` : ''}
        <div class="qc-footer">
          <div class="qc-tags">
            <span class="qc-tag" onclick="filterByTag('${escapeHtml(q.horizon)}')">#${escapeHtml(q.horizon)}</span>
            ${(q.tags || []).map(t => `<span class="qc-tag" onclick="filterByTag('${escapeHtml(t)}')">#${escapeHtml(t)}</span>`).join('')}
          </div>
          <button class="btn-spark ${isSaved ? 'saved' : ''}" type="button" onclick="toggleSpark('${escapeHtml(q.work)}')">
            ${isSaved ? '✓ Saved' : '+ Read Next'}
          </button>
        </div>
      </article>
    `;
  }).join("");

  $("quotesStream").insertAdjacentHTML("beforeend", html);
  renderedCount += slice.length;
  $("loadMoreWrap").style.display = renderedCount < currentFilteredList.length ? "block" : "none";
}

window.filterByTag = function(tag) {
  bankActiveTag = tag;
  $("activeTagName").textContent = tag;
  $("activeTagContainer").style.display = "inline-flex";
  renderBankStream(true);
};

window.toggleSpark = function(work) {
  if (sparkQueue.includes(work)) {
    sparkQueue = sparkQueue.filter(w => w !== work);
  } else {
    sparkQueue.push(work);
  }
  store.set("sparkQueue", sparkQueue);
  $("sparkQueueCount").textContent = sparkQueue.length;
  renderBankStream(true);
};

function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function highlightQuote(card) {
  let text = escapeHtml(card.quote);
  for (const h of card.highlights || []) {
    const escH = escapeHtml(h);
    text = text.replace(escH, `<mark class="q">${escH}</mark>`);
  }
  return text;
}

// Init
$("sparkQueueCount").textContent = sparkQueue.length;
renderApp();
</script>
