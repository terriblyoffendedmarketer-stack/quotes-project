<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia — Daily Craft & Personal Library Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@48,700,100,0&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #f4f5f2;
  --sheet: #ffffff;
  --ink: #1b1d22;
  --ink-soft: #565a63;
  --rule: #dcdfe0;
  --marker: #f5e36a;
  --marker-ink: #1b1d22;
  --accent: #2d3be8;
  --spark-gold: #c98a00;
  --s-hook: #2d3be8; --s-line: var(--l-line); --s-look: var(--l-look); --s-steal: var(--l-steal); --s-around: var(--l-around);
  --hook-ink: #fff4df; --hook-soft: rgba(255, 244, 223, .8); --hook-pill: #fff4df;
  --font-hook: "Fraunces", Georgia, serif;
  --font-line: "Literata", Georgia, "Times New Roman", serif;
  --font-note: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-tag: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111317; --sheet: #1a1d22; --ink: #e9e8e3; --ink-soft: #a2a5ab;
    --rule: #2c3036; --marker: #b9a63a; --marker-ink: #111317; --accent: #6f80ff; --spark-gold: #f2ba42; color-scheme: dark;
    --s-line: var(--d-line); --s-look: var(--d-look); --s-steal: var(--d-steal); --s-around: var(--d-around);
  }
}
:root[data-theme="dark"] {
  --paper: #111317; --sheet: #1a1d22; --ink: #e9e8e3; --ink-soft: #a2a5ab;
  --rule: #2c3036; --marker: #b9a63a; --marker-ink: #111317; --accent: #6f80ff; --spark-gold: #f2ba42; color-scheme: dark;
  --s-line: var(--d-line); --s-look: var(--d-look); --s-steal: var(--d-steal); --s-around: var(--d-around);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-note); font-size: 16px; line-height: 1.55;
  padding-inline: 16px; padding-block: 16px 36px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-tag); font-size: 12px; color: var(--ink-soft); letter-spacing: .04em; }
.top-title { font-weight: 700; color: var(--ink); letter-spacing: .08em; }

.modes { display: flex; gap: 3px; background: var(--sheet); padding: 3px; border: 1px solid var(--rule); border-radius: 99px; }
.mode-btn { font: 600 11.5px/1 var(--font-tag); letter-spacing: .03em; color: var(--ink-soft); background: none; border: 0; border-radius: 99px; padding: 7px 12px; cursor: pointer; transition: all .15s ease; }
.mode-btn[aria-pressed="true"] { color: var(--paper); background: var(--ink); }

/* Card Deck Styles */
.deck { min-width: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; overflow: hidden; }
.track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; padding: 26px 22px 22px; min-height: 480px; display: flex; flex-direction: column; gap: 16px; }

.slide.hook { background: var(--s-hook); color: var(--hook-ink); }
.slide.line-s { background: var(--s-line); }
.slide.look { background: var(--s-look); }
.slide.steal-s { background: var(--s-steal); }
.slide.around { background: var(--s-around); }
.pill { align-self: flex-start; font: 700 13px/1 var(--font-note); letter-spacing: .08em; text-transform: uppercase; background: var(--hook-pill); color: var(--s-hook); border-radius: 99px; padding: 7px 14px; }
.hook-title { font-family: var(--font-hook); font-weight: 700; font-variation-settings: "opsz" 48, "SOFT" 100, "WONK" 0; font-size: clamp(2.4rem, 12vw, 3.2rem); line-height: 1.04; letter-spacing: -.01em; text-wrap: balance; margin: auto 0; }
.hook-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 14px/1.2 var(--font-note); color: var(--hook-soft); }
.hook-foot span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hook-foot span:last-child { flex: none; }
.fine { font-size: 12px; font-style: italic; color: var(--ink-soft); margin-top: -10px; }
.job { font-family: var(--font-tag); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.line { white-space: pre-line; font-family: var(--font-line); font-size: 1.45rem; line-height: 1.42; text-wrap: pretty; margin: auto 0; }
.line.long { font-size: 1.2rem; }
.who { font-size: 13.5px; color: var(--ink-soft); }
.who cite { font-style: italic; color: var(--ink); font-weight: 500; }

.kicker { font-family: var(--font-tag); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.mini { white-space: pre-line; font-family: var(--font-line); font-size: 1rem; line-height: 1.5; color: var(--ink-soft); border-left: 2px solid var(--rule); padding-left: 12px; }
mark { background: linear-gradient(transparent 12%, var(--marker) 12%, var(--marker) 88%, transparent 88%); color: var(--marker-ink); padding: 0 2px; }
.note { font-size: 1.02rem; text-wrap: pretty; }
.note p { margin: 0; }
.note strong { font-weight: 600; }
mark.q { font-family: var(--font-line); font-style: italic; }

.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 12px 12px 14px; }
.dots button { font: 500 11px/1 var(--font-tag); letter-spacing: .04em; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 99px; padding: 6px 9px; white-space: nowrap; cursor: pointer; }
.dots button[aria-current="true"] { color: var(--ink); border-color: var(--ink); }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.nav button, .toggle { font: 500 14px/1 var(--font-note); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.nav button:disabled { opacity: .4; cursor: default; }
.count { font-family: var(--font-tag); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.widget-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.widget { background: var(--s-hook); color: var(--hook-ink); border-radius: 24px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; border: 0; text-align: left; font: inherit; }
.widget .wl { font-family: var(--font-hook); font-weight: 700; font-variation-settings: "opsz" 48, "SOFT" 100, "WONK" 0; font-size: 2rem; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.caption { font-size: 13px; color: var(--ink-soft); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ==========================================================================
   QUOTE BANK: THEMATIC HORIZONS & READING COMPANION STYLES
   ========================================================================== */
.bank-container { display: flex; flex-direction: column; gap: 16px; }

/* Search & Filter Header */
.bank-header-panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-input { flex: 1; font: 500 14px/1.4 var(--font-note); background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; outline: none; transition: border-color .15s; }
.search-input:focus { border-color: var(--ink); }
.btn-surprise { font: 600 13px/1 var(--font-note); background: var(--ink); color: var(--paper); border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-surprise:hover { opacity: .9; }

/* Thematic Horizon Pills */
.horizons-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.horizons-bar::-webkit-scrollbar { display: none; }
.horizon-chip { font: 500 11px/1 var(--font-tag); background: var(--paper); color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 10px; white-space: nowrap; cursor: pointer; transition: all .15s; }
.horizon-chip:hover { color: var(--ink); border-color: var(--ink-soft); }
.horizon-chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Active Filter Badges */
.filter-active-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
.active-tag-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--paper); font: 500 11px/1 var(--font-tag); padding: 4px 10px; border-radius: 99px; }
.active-tag-pill button { background: none; border: 0; color: var(--paper); cursor: pointer; padding: 0; font-weight: bold; font-size: 13px; line-height: 1; }
.spark-queue-btn { font: 600 11px/1 var(--font-tag); background: var(--paper); color: var(--spark-gold); border: 1px solid var(--rule); border-radius: 99px; padding: 5px 9px; cursor: pointer; }
.spark-queue-btn[aria-pressed="true"] { background: var(--spark-gold); color: #fff; border-color: var(--spark-gold); }

/* The Stream of Quotes */
.horizon-section { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.horizon-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-top: 14px; }
.horizon-title { font-family: var(--font-tag); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.horizon-count { font-family: var(--font-tag); font-size: 11px; color: var(--ink-soft); }

.quote-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; transition: border-color .15s, box-shadow .15s; }
.quote-card:hover { border-color: var(--ink-soft); }
.quote-card.spark-highlight { border-color: var(--spark-gold); box-shadow: 0 0 0 1px var(--spark-gold); }

.qc-quote { font-family: var(--font-line); font-size: 1.35rem; line-height: 1.44; margin: 0; color: var(--ink); text-wrap: pretty; }
.qc-quote.long { font-size: 1.15rem; }

.qc-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-soft); }
.qc-book { font-weight: 600; color: var(--ink); font-family: var(--font-line); }

.qc-explanation { background: var(--paper); border-left: 3px solid var(--accent); border-radius: 6px; padding: 11px 13px; font-size: 13.5px; line-height: 1.48; color: var(--ink); }
.qc-explanation-label { font-family: var(--font-tag); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 600; margin-bottom: 3px; display: block; }

.qc-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.qc-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.qc-tag { font: 500 10.5px/1 var(--font-tag); background: var(--paper); color: var(--ink-soft); padding: 4px 7px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
.qc-tag:hover { color: var(--ink); border-color: var(--rule); }

.btn-spark { font: 600 11.5px/1 var(--font-tag); background: transparent; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all .15s; }
.btn-spark:hover { color: var(--spark-gold); border-color: var(--spark-gold); }
.btn-spark.saved { background: var(--paper); color: var(--spark-gold); border-color: var(--spark-gold); }

/* Infinite / Load More */
.load-more-wrap { text-align: center; padding: 18px 0; }
.btn-load-more { font: 600 13px/1 var(--font-note); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 11px 22px; cursor: pointer; }
.btn-load-more:hover { border-color: var(--ink); }

@media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="top-title">MARGINALIA</span>
    <nav class="modes" aria-label="Switch views">
      <button class="mode-btn" id="modeCards" aria-pressed="true">Daily Cards (108)</button>
      <button class="mode-btn" id="modeBank" aria-pressed="false">Quote Bank (1,871)</button>
    </nav>
    <span id="day"></span>
  </header>

  <!-- VIEW 1: DAILY 5-SLIDE CRAFT DECK -->
  <main id="viewCards">
    <section class="deck" aria-label="Today's card">
      <div class="track" id="track"></div>
      <div class="dots" id="dots"></div>
    </section>

    <div class="nav" style="margin-top:14px">
      <button id="prev" type="button">← Previous</button>
      <span class="count" id="count"></span>
      <button id="next" type="button">Next →</button>
    </div>

    <div class="row" style="margin-top:12px">
      <span class="caption">Swipe sideways. Each slide is one step deeper.</span>
      <button class="toggle" id="stealToggle" type="button"></button>
    </div>

    <div class="widget-wrap">
      <span class="kicker">On your home screen</span>
      <button class="widget" id="widget" type="button" aria-label="Widget preview, opens the card">
        <span class="pill" id="wPill">How to</span>
        <span class="wl" id="wLine"></span>
        <span class="hook-foot" style="font-size:13px"><span id="wAuthor"></span><span>The line that does it →</span></span>
      </button>
      <span class="caption">Flick through every slide directly inside the Android widget on your phone.</span>
    </div>
  </main>

  <!-- VIEW 2: MASTER QUOTE BANK (CONTINUOUS THEMATIC HORIZONS) -->
  <main id="viewBank" class="bank-container" hidden>
    <!-- Search & Navigation Panel -->
    <section class="bank-header-panel">
      <div class="search-row">
        <input type="text" class="search-input" id="bankSearch" placeholder="Search 1,871 quotes, authors, books..." autocomplete="off">
        <button class="btn-surprise" id="btnSurprise" type="button" title="Jump to a surprise quote">🎲 Surprise</button>
      </div>

      <!-- Thematic Horizon Chips -->
      <nav class="horizons-bar" id="horizonsBar" aria-label="Thematic Horizons">
        <button class="horizon-chip" data-h="all" aria-pressed="true">All (1,871)</button>
        <button class="horizon-chip" data-h="dread" aria-pressed="false">Atmospheric Dread</button>
        <button class="horizon-chip" data-h="folly" aria-pressed="false">Human Folly</button>
        <button class="horizon-chip" data-h="solitude" aria-pressed="false">Solitude & Finitude</button>
        <button class="horizon-chip" data-h="stakes" aria-pressed="false">High Stakes</button>
        <button class="horizon-chip" data-h="irony" aria-pressed="false">Sharp Irony</button>
        <button class="horizon-chip" data-h="power" aria-pressed="false">Power & History</button>
        <button class="horizon-chip" data-h="prose" aria-pressed="false">Observation & Prose</button>
      </nav>

      <!-- Filter Stats & Reading Queue Toggle -->
      <div class="filter-active-row">
        <div>
          <span id="bankMatchCount">1,871</span> quotes across <span id="bankBooksCount">416</span> books
          <span id="activeTagContainer" style="margin-left:8px; display:none">
            <span class="active-tag-pill">#<span id="activeTagName"></span> <button id="btnClearTag" type="button">×</button></span>
          </span>
        </div>
        <button class="spark-queue-btn" id="btnSparkQueue" type="button" aria-pressed="false">✨ Read Next Queue (<span id="sparkQueueCount">0</span>)</button>
      </div>
    </section>

    <!-- Continuous Stream of Quotes -->
    <div id="quotesStream" class="quotes-stream">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Infinite Scroll / Load More -->
    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="btn-load-more" id="btnLoadMore" type="button">Load More Quotes ↓</button>
    </div>
  </main>
</div>

<script>
const CARDS = /*CARDS*/[];
const QUOTE_BANK = /*QUOTE_BANK*/[];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const dayNumber = Math.floor(Date.now() / 86400000);

const HOOKS = ["#2d3be8", "#d9402a", "#1f6b45", "#7a2a7a", "#0f6e74", "#bf4a17", "#c21f6e", "#5b2bd9", "#14161b"];
const LIGHT = ["#ffe9a8", "#ffd0e1", "#d2f3b0", "#dcd0ff", "#ffd6bf", "#cde7ff", "#c4f0e0", "#f2e3c6", "#ffc2b8"];
const DARK = ["#5e460c", "#571f3b", "#1f4527", "#2e2870", "#6a2e14", "#173a5e", "#0f4a44", "#4a3524", "#6b1f2a"];
const seeded = seed => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const shuffled = (n, rand) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function palette(day) {
  const order = shuffled(HOOKS.length, seeded(Math.floor(day / HOOKS.length) * 7919 + 17));
  const picks = shuffled(LIGHT.length, seeded(day * 104729 + 3)).slice(0, 4);
  if (picks[1] === 0) [picks[0], picks[1]] = [picks[1], picks[0]];
  const root = document.documentElement.style;
  root.setProperty("--s-hook", HOOKS[order[((day % HOOKS.length) + HOOKS.length) % HOOKS.length]]);
  ["line", "look", "steal", "around"].forEach((k, i) => { root.setProperty(`--l-${k}`, LIGHT[picks[i]]); root.setProperty(`--d-${k}`, DARK[picks[i]]); });
}

const todayIndex = dayNumber % (CARDS.length || 1);
let index = todayIndex;
let showSteal = store.get("showSteal", true);

const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const note = s => {
  let h = md(s);
  const m = h.slice(12).search(/[.!?]”?\s/);
  if (m >= 0) { const end = 12 + m + (h[12 + m + 1] === "”" ? 2 : 1); h = "<strong>" + h.slice(0, end) + "</strong>" + h.slice(end); }
  return h.replace(/“([^”]{1,80})”/g, '<mark class="q">“$1”</mark>');
};

function marked(card) {
  let html = esc(card.quote);
  for (const h of card.highlights || []) {
    const e = esc(h);
    const i = html.indexOf(e);
    if (i >= 0) html = html.slice(0, i) + "<mark>" + e + "</mark>" + html.slice(i + e.length);
  }
  return html;
}

function credit(item) {
  return `${esc(item.author)}, <cite>${esc(item.work)}</cite>${item.translator ? ` · trans. ${esc(item.translator)}` : ""}`;
}

/* ==========================================================================
   CARDS VIEW RENDERER
   ========================================================================== */
function renderCards() {
  if (!CARDS.length) return;
  const c = CARDS[index];
  const howTo = c.job.startsWith("How to ");
  palette(dayNumber + index - todayIndex);
  const fine = `<div class="fine">${esc(c.job)}</div>`;
  const slides = [
    { tab: "How to", cls: "hook", html: `
      ${howTo ? '<span class="pill">How to</span>' : ""}
      <h2 class="hook-title">${esc(howTo ? c.job.slice(7) : c.job)}</h2>
      <div class="hook-foot"><span>${esc(c.author)}</span><span>The line that does it →</span></div>` },
    { tab: "The line", cls: "line-s", html: `
      <div class="kicker">The line</div>
      <p class="line${c.quote.length > 180 ? " long" : ""}">“${esc(c.quote)}”</p>
      <div class="who">${credit(c)}</div>${fine}` },
    { tab: "Look closer", cls: "look", html: `
      <div class="kicker">Look closer</div>
      <p class="mini">${marked(c)}</p>
      <div class="note"><p>${note(c.lookCloser)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` }
  ];
  if (showSteal) slides.push({ tab: "Steal it", cls: "steal-s", html: `
      <div class="kicker">Steal it</div>
      <div class="note"><p>${note(c.stealIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` });
  slides.push({ tab: "Around it", cls: "around", html: `
      <div class="kicker">Around it</div>
      <div class="note"><p>${note(c.aroundIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)} · ${c.year}</div>${fine}` });

  $("track").innerHTML = slides.map((s, i) => `<article class="slide ${s.cls}" aria-label="${s.tab}">${s.html}</article>`).join("");
  $("dots").innerHTML = slides.map((s, i) => `<button type="button" data-i="${i}" aria-current="${i === 0}">${s.tab}</button>`).join("");
  $("track").scrollLeft = 0;

  $("day").innerHTML = index === todayIndex ? "<b>TODAY</b>" : `CARD ${String(index + 1).padStart(2, "0")}`;
  $("count").textContent = `${index + 1} / ${CARDS.length}`;
  $("stealToggle").textContent = showSteal ? "Hide “Steal it”" : "Show “Steal it”";
  $("wPill").hidden = !howTo;
  $("wAuthor").textContent = c.author;
  $("wLine").textContent = howTo ? c.job.slice(7) : c.job;
}

/* ==========================================================================
   QUOTE BANK: THEMATIC HORIZONS & STREAM ENGINE
   ========================================================================== */
const THEMES = [
  { code: "dread", title: "Atmospheric Dread & The Uncanny", kw: new Set(["dread", "horror", "fear", "death", "dark", "eerie", "uncanny", "haunting", "tension", "macabre", "grotesque"]) },
  { code: "folly", title: "Human Folly & Social Pretense", kw: new Set(["folly", "vanity", "satire", "hypocrisy", "manners", "social", "pretension", "awkwardness", "family", "prejudice", "pride"]) },
  { code: "solitude", title: "Solitude, Stillness & Finitude", kw: new Set(["solitude", "stillness", "time", "silence", "memory", "grief", "mortality", "loss", "longing", "reflection", "quiet", "finitude", "loneliness"]) },
  { code: "stakes", title: "High Stakes & Moral Friction", kw: new Set(["stakes", "high-stakes", "choice", "sacrifice", "survival", "courage", "crisis", "danger", "pressure", "willpower", "duty", "moral"]) },
  { code: "irony", title: "Sharp Bites of Irony", kw: new Set(["irony", "dark-humor", "humor", "wit", "cynicism", "absurdity", "paradox", "comedy", "dry", "understatement", "wry"]) },
  { code: "power", title: "The Machinery of Power & History", kw: new Set(["power", "history", "politics", "empire", "systems", "bureaucracy", "control", "civilization", "war", "ideology", "propaganda"]) },
  { code: "prose", title: "Observation & Prose Rhythm", kw: new Set(["observation", "prose", "rhythm", "sensory-detail", "detail", "voice"]) }
];

// Pre-assign each quote to its primary horizon
QUOTE_BANK.forEach(q => {
  const tags = new Set(q.tags || []);
  const text = (q.quote + " " + (q.explanation || "")).toLowerCase();
  for (const t of THEMES) {
    if (tags.size && [...tags].some(tag => t.kw.has(tag))) {
      q.horizon = t.code;
      return;
    }
  }
  for (const t of THEMES) {
    for (const w of t.kw) {
      if (text.includes(w)) {
        q.horizon = t.code;
        return;
      }
    }
  }
  q.horizon = "prose";
});

let bankQuery = "";
let bankActiveHorizon = "all";
let bankActiveTag = null;
let bankShowingSparkQueue = false;
let sparkQueue = store.get("sparkQueue", []); // Array of work titles
let renderedCount = 0;
const PAGE_SIZE = 35;
let currentFilteredList = [];

function updateSparkCount() {
  $("sparkQueueCount").textContent = sparkQueue.length;
}

function getFilteredBank() {
  return QUOTE_BANK.filter(q => {
    // 1. Reading Queue filter
    if (bankShowingSparkQueue) {
      if (!sparkQueue.includes(q.work)) return false;
    }
    // 2. Horizon filter
    if (bankActiveHorizon !== "all" && q.horizon !== bankActiveHorizon) {
      return false;
    }
    // 3. Tag filter
    if (bankActiveTag && !(q.tags || []).includes(bankActiveTag)) {
      return false;
    }
    // 4. Text Query
    if (bankQuery) {
      const qLower = bankQuery.toLowerCase();
      const matchQuote = q.quote.toLowerCase().includes(qLower);
      const matchWork = q.work.toLowerCase().includes(qLower);
      const matchAuthor = q.author.toLowerCase().includes(qLower);
      const matchExp = (q.explanation || "").toLowerCase().includes(qLower);
      const matchTags = (q.tags || []).some(t => t.toLowerCase().includes(qLower));
      if (!matchQuote && !matchWork && !matchAuthor && !matchExp && !matchTags) {
        return false;
      }
    }
    return true;
  });
}

function renderBankStream(reset = true) {
  if (reset) {
    renderedCount = 0;
    currentFilteredList = getFilteredBank();
    $("quotesStream").innerHTML = "";
    
    // Update count labels
    $("bankMatchCount").textContent = currentFilteredList.length.toLocaleString();
    const books = new Set(currentFilteredList.map(q => q.work));
    $("bankBooksCount").textContent = books.size.toLocaleString();
  }

  const slice = currentFilteredList.slice(renderedCount, renderedCount + PAGE_SIZE);
  renderedCount += slice.length;

  if (renderedCount >= currentFilteredList.length) {
    $("loadMoreWrap").style.display = "none";
  } else {
    $("loadMoreWrap").style.display = "block";
  }

  if (currentFilteredList.length === 0) {
    $("quotesStream").innerHTML = `
      <div style="text-align:center; padding:40px 20px; color:var(--ink-soft)">
        <p style="font-family:var(--font-line); font-size:1.2rem; margin-bottom:8px">No lines found matching your search.</p>
        <p style="font-size:13px">Try clearing filters or searching another keyword.</p>
      </div>
    `;
    return;
  }

  const html = slice.map((q, idx) => {
    const isSaved = sparkQueue.includes(q.work);
    const yearStr = q.year ? ` · ${q.year}` : "";
    return `
      <article class="quote-card" id="qcard_${esc(q.work)}_${idx}">
        <p class="qc-quote${q.quote.length > 180 ? ' long' : ''}">“${esc(q.quote)}”</p>
        
        <div class="qc-meta">
          <span class="qc-book">${esc(q.work)}</span>
          <span>${esc(q.author)}${yearStr}</span>
        </div>

        ${q.explanation ? `
          <div class="qc-explanation">
            <span class="qc-explanation-label">Scene Context</span>
            ${esc(q.explanation)}
          </div>
        ` : ''}

        <div class="qc-footer">
          <div class="qc-tags">
            ${(q.tags || []).map(t => `<button type="button" class="qc-tag" onclick="filterByTag('${esc(t)}')">#${esc(t)}</button>`).join('')}
          </div>
          <button type="button" class="btn-spark${isSaved ? ' saved' : ''}" onclick="toggleSpark('${esc(q.work)}')">
            ${isSaved ? '✓ In Queue' : '✨ Read Next'}
          </button>
        </div>
      </article>
    `;
  }).join("");

  $("quotesStream").insertAdjacentHTML("beforeend", html);
}

window.filterByTag = function(tag) {
  bankActiveTag = tag;
  $("activeTagName").textContent = tag;
  $("activeTagContainer").style.display = "inline-flex";
  renderBankStream(true);
};

window.toggleSpark = function(workTitle) {
  if (sparkQueue.includes(workTitle)) {
    sparkQueue = sparkQueue.filter(w => w !== workTitle);
  } else {
    sparkQueue.push(workTitle);
  }
  store.set("sparkQueue", sparkQueue);
  updateSparkCount();
  // Re-render to update button states
  const cards = document.querySelectorAll(".quote-card");
  renderBankStream(true);
};

/* ==========================================================================
   EVENT HANDLERS
   ========================================================================== */
$("modeCards").addEventListener("click", () => {
  $("modeCards").setAttribute("aria-pressed", "true");
  $("modeBank").setAttribute("aria-pressed", "false");
  $("viewCards").hidden = false;
  $("viewBank").hidden = true;
  $("day").hidden = false;
});

$("modeBank").addEventListener("click", () => {
  $("modeCards").setAttribute("aria-pressed", "false");
  $("modeBank").setAttribute("aria-pressed", "true");
  $("viewCards").hidden = true;
  $("viewBank").hidden = false;
  $("day").hidden = true;
  if (!renderedCount) {
    renderBankStream(true);
  }
});

$("horizonsBar").addEventListener("click", e => {
  const btn = e.target.closest(".horizon-chip");
  if (!btn) return;
  document.querySelectorAll(".horizon-chip").forEach(b => b.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  bankActiveHorizon = btn.dataset.h;
  renderBankStream(true);
});

$("bankSearch").addEventListener("input", e => {
  bankQuery = e.target.value.trim();
  renderBankStream(true);
});

$("btnClearTag").addEventListener("click", () => {
  bankActiveTag = null;
  $("activeTagContainer").style.display = "none";
  renderBankStream(true);
});

$("btnSparkQueue").addEventListener("click", () => {
  bankShowingSparkQueue = !bankShowingSparkQueue;
  $("btnSparkQueue").setAttribute("aria-pressed", String(bankShowingSparkQueue));
  renderBankStream(true);
});

$("btnLoadMore").addEventListener("click", () => {
  renderBankStream(false);
});

$("btnSurprise").addEventListener("click", () => {
  // Clear search and filters to surprise from whole bank
  bankQuery = "";
  $("bankSearch").value = "";
  bankActiveTag = null;
  $("activeTagContainer").style.display = "none";
  bankActiveHorizon = "all";
  document.querySelectorAll(".horizon-chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.h === "all"));
  bankShowingSparkQueue = false;
  $("btnSparkQueue").setAttribute("aria-pressed", "false");

  currentFilteredList = getFilteredBank();
  const randIdx = Math.floor(Math.random() * currentFilteredList.length);
  const picked = currentFilteredList[randIdx];

  // Put picked quote right at top of stream
  currentFilteredList.splice(randIdx, 1);
  currentFilteredList.unshift(picked);

  renderBankStream(true);

  // Highlight first card
  const firstCard = document.querySelector(".quote-card");
  if (firstCard) {
    firstCard.classList.add("spark-highlight");
    firstCard.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => firstCard.classList.remove("spark-highlight"), 3000);
  }
});

// Card deck event listeners
$("dots").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = $("track");
  t.scrollTo({ left: t.clientWidth * Number(b.dataset.i), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
$("track").addEventListener("scroll", () => {
  const t = $("track");
  const i = Math.round(t.scrollLeft / t.clientWidth);
  [...$("dots").children].forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
}, { passive: true });
$("prev").addEventListener("click", () => { index = (index - 1 + CARDS.length) % CARDS.length; renderCards(); });
$("next").addEventListener("click", () => { index = (index + 1) % CARDS.length; renderCards(); });
$("stealToggle").addEventListener("click", () => { showSteal = !showSteal; store.set("showSteal", showSteal); renderCards(); });
$("widget").addEventListener("click", () => { $("track").scrollLeft = 0; window.scrollTo({ top: 0, behavior: "smooth" }); });

// Initialize
renderCards();
updateSparkCount();
</script>
</body>
</html>
