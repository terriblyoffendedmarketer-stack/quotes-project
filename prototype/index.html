n them. The candle and the shadow are ordinary objects, which makes a deep idea feel like plain observation.", "stealIt": "Write the trade-off in your product as an equation, “To … is to …”. “To automate a report is to stop reading it.” If it's true, it'll make readers stop and think.", "aroundIt": "A teacher at the school for wizards says it to the young Ged, who is far too eager to use his power. Ged doesn't listen, and to show off he summons something from the dead that tears open the night and comes after him. Le Guin wrote it as a book for young readers in 1968, with a wizard who isn't white, which publishers then hid on the covers.", "verification": "Checked against published excerpts."}, {"id": "oliver-summer-day-ending", "job": "How to end on a question that won't let go", "quote": "Tell me, what else should I have done?\nDoesn't everything die at last, and too soon?\nTell me, what is it you plan to do\nwith your one wild and precious life?", "author": "Mary Oliver", "work": "The Summer Day", "year": 1990, "translator": null, "highlights": ["Doesn't everything die at last, and too soon?", "your one wild and precious life"], "lookCloser": "The poem has spent a whole summer day idling in a field watching a grasshopper. These lines defend that idleness and then turn the question round on you. “Tell me” makes it personal and urgent. “One” makes it finite, “wild” makes it free, and “precious” makes it valuable, three words that each do a different job. The question is so direct you feel you owe it an answer.", "stealIt": "End your next post with one direct question to the reader that uses “you” and a specific, slightly unexpected adjective. Leave it unanswered.", "aroundIt": "The poem opens by asking who made the world, then narrows to one grasshopper eating sugar out of the speaker's hand. Oliver walked the woods near Provincetown most mornings for decades with a notebook, and she said she hid pencils in the trees in case she ran out.", "verification": "Closing lines, checked against published text."}, {"id": "white-charlottes-web-opening", "job": "How to start a children's book with a threat", "quote": "“Where's Papa going with that ax?” said Fern to her mother as they were setting the table for breakfast.", "author": "E. B. White", "work": "Charlotte's Web", "year": 1952, "translator": null, "highlights": ["Where's Papa going with that ax?", "setting the table for breakfast"], "lookCloser": "The first words are a child's question, and the question has an axe in it. White sets the danger against the most domestic scene there is, a mother and daughter laying the table. Nobody has answered yet, so you're already worried. It's a children's book that opens with a life and death decision, and it never talks down to you about it.", "stealIt": "Open your next piece with a short question someone actually asked, and put the danger inside it. Then place it in the most ordinary setting you can.", "aroundIt": "Papa is going to kill a runt pig. Fern talks him out of it and names the pig Wilbur. White kept pigs on his farm in Maine and wrote the book after failing to save one who fell ill. He also spent time watching a spider spin her egg sac in his barn, and took the sac to New York when he went, so he could watch the babies hatch.", "verification": "Opening sentence. Some printings read “the ax”, so check against your edition.", "lintAccepted": ["possible triad"]}, {"id": "seneca-shortness-of-life", "job": "How to flip a complaint into an accusation", "quote": "It is not that we have a short space of time, but that we waste much of it. Life is long enough, and it has been given in sufficiently generous measure to allow the accomplishment of the very greatest things if the whole of it is well invested.", "author": "Seneca", "work": "On the Shortness of Life", "year": 49, "translator": "John W. Basore", "highlights": ["we waste much of it", "Life is long enough", "well invested"], "lookCloser": "Everyone complains that life is short. Seneca, writing nearly two thousand years ago, turns the complaint back on you. The problem is your spending. Then he uses a money word, “invested”, so time becomes capital you're squandering. He's blunt about it, and the bluntness is a kind of respect. He assumes you can do better.", "stealIt": "Take the most common complaint your customers make and turn it gently back on them, using the language of something they already manage carefully, like money or headcount.", "aroundIt": "Seneca wrote it as a letter to a friend, Paulinus, who managed Rome's grain supply. Seneca was a philosopher who also tutored the young emperor Nero and became one of the richest men in Rome. Nero later ordered him to kill himself, and he did.", "verification": "Basore translation (1932), checked. Date of the essay is approximate."}, {"id": "dickens-tale-of-two-cities-opening", "job": "How to build a list that ends on a joke", "quote": "It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief, it was the epoch of incredulity, it was the season of Light, it was the season of Darkness, it was the spring of hope, it was the winter of despair, we had everything before us, we had nothing before us, we were all going direct to Heaven, we were all going direct the other way—in short, the period was so far like the present period, that some of its noisiest authorities insisted on its being received, for good or for evil, in the superlative degree of comparison only.", "author": "Charles Dickens", "work": "A Tale of Two Cities", "year": 1859, "translator": null, "highlights": ["It was the best of times, it was the worst of times", "going direct the other way", "in the superlative degree of comparison only"], "lookCloser": "Everyone remembers the first ten words and forgets the punchline. The pairs of opposites build like a sermon until “going direct the other way”, a polite way of saying hell. Then “in short” deflates everything. The whole grand list turns out to be a joke about pundits who can only talk in superlatives. Dickens is mocking the very style he's using.", "stealIt": "Write a run of grand opposites about your industry, then end with “in short” and a dry comment on the people who talk that way. You get the drama and the wink.", "aroundIt": "The year is 1775, and the two cities are London and Paris on the way to the French Revolution. Dickens published it in weekly parts in his own magazine. He said the idea came to him while acting in a play about a man who gives up his life for a rival in love. The novel ends with a man about to do just that.", "verification": "Opening sentence, standard text."}];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const dayNumber = Math.floor(Date.now() / 86400000);
const todayIndex = dayNumber % CARDS.length;
let index = todayIndex;
let showSteal = store.get("showSteal", true);

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Titles are marked with *asterisks* in the card text and shown in italics.
const md = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
// Explanation slides: bold opening sentence, quoted phrases set like the marked words on the quote.
const note = s => {
  let h = md(s);
  const m = h.slice(12).search(/[.!?]”?\s/);
  if (m >= 0) { const end = 12 + m + (h[12 + m + 1] === "”" ? 2 : 1); h = "<strong>" + h.slice(0, end) + "</strong>" + h.slice(end); }
  return h.replace(/“([^”]{1,80})”/g, '<mark class="q">“$1”</mark>');
};

function marked(card) {
  let html = esc(card.quote);
  for (const h of card.highlights) {
    const e = esc(h);
    const i = html.indexOf(e);
    if (i >= 0) html = html.slice(0, i) + "<mark>" + e + "</mark>" + html.slice(i + e.length);
  }
  return html;
}

function credit(card) {
  return `${esc(card.author)}, <cite>${esc(card.work)}</cite>${card.translator ? ` · trans. ${esc(card.translator)}` : ""}`;
}

function render() {
  const c = CARDS[index];
  const howTo = c.job.startsWith("How to ");
  // Every slide after the hook carries the job in fine print at the bottom.
  const fine = `<div class="fine">${esc(c.job)}</div>`;
  const slides = [
    { tab: "How to", cls: "hook", html: `
      ${howTo ? '<span class="pill">How to</span>' : ""}
      <h2 class="hook-title">${esc(howTo ? c.job.slice(7) : c.job)}</h2>
      <span class="hook-hint">The line that does it →</span>` },
    { tab: "The line", cls: "line-s", html: `
      <div class="kicker">The line</div>
      <p class="line${c.quote.length > 180 ? " long" : ""}">“${esc(c.quote)}”</p>
      <div class="who">${credit(c)}</div>${fine}` },
    { tab: "Look closer", cls: "look", html: `
      <div class="kicker">Look closer</div>
      <p class="mini">${marked(c)}</p>
      <div class="note"><p>${note(c.lookCloser)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` }
  ];
  if (showSteal) slides.push({ tab: "Steal it", cls: "steal-s", html: `
      <div class="kicker">Steal it</div>
      <div class="note"><p>${note(c.stealIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` });
  slides.push({ tab: "Around it", cls: "around", html: `
      <div class="kicker">Around it</div>
      <div class="note"><p>${note(c.aroundIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)} · ${c.year}</div>${fine}` });

  $("track").innerHTML = slides.map((s, i) => `<article class="slide ${s.cls}" aria-label="${s.tab}">${s.html}</article>`).join("");
  $("dots").innerHTML = slides.map((s, i) => `<button type="button" data-i="${i}" aria-current="${i === 0}">${s.tab}</button>`).join("");
  $("track").scrollLeft = 0;

  $("day").innerHTML = index === todayIndex ? "<b>TODAY</b>" : `CARD ${String(index + 1).padStart(2, "0")}`;
  $("count").textContent = `${index + 1} / ${CARDS.length}`;
  $("stealToggle").textContent = showSteal ? "Hide “Steal it”" : "Show “Steal it”";
  $("wPill").hidden = !howTo;
  $("wLine").textContent = howTo ? c.job.slice(7) : c.job;
}

$("dots").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = $("track");
  t.scrollTo({ left: t.clientWidth * Number(b.dataset.i), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
$("track").addEventListener("scroll", () => {
  const t = $("track");
  const i = Math.round(t.scrollLeft / t.clientWidth);
  [...$("dots").children].forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
}, { passive: true });
$("prev").addEventListener("click", () => { index = (index - 1 + CARDS.length) % CARDS.length; render(); });
$("next").addEventListener("click", () => { index = (index + 1) % CARDS.length; render(); });
$("stealToggle").addEventListener("click", () => { showSteal = !showSteal; store.set("showSteal", showSteal); render(); });
$("widget").addEventListener("click", () => { $("track").scrollLeft = 0; window.scrollTo({ top: 0, behavior: "smooth" }); });

render();
</script>
