ual hours, including the one you're in. It ends on “doing” where you half expect something grander, and the plainness is why it sticks.", "stealIt": "Insert a calm 'of course' into the center of a startling equation. Act as though the terrifying equivalence between a single afternoon and an entire lifetime is common sense.", "aroundIt": "*The Writing Life* is a short book about the daily grind of making books. In it Dillard advises writers to choose a room with no view. She had won the Pulitzer Prize at twenty-nine for *Pilgrim at Tinker Creek*. Three decades later, Oliver Burkeman made much the same argument across a whole book.", "verification": "Checked against published excerpts."}, {"id": "orwell-1984-opening", "job": "How to signal that something is wrong with one detail", "quote": "It was a bright cold day in April, and the clocks were striking thirteen. Winston Smith, his chin nuzzled into his breast in an effort to escape the vile wind, slipped quickly through the glass doors of Victory Mansions, though not quickly enough to prevent a swirl of gritty dust from entering along with him.", "author": "George Orwell", "work": "Nineteen Eighty-Four", "year": 1949, "translator": null, "highlights": ["the clocks were striking thirteen", "the vile wind", "Victory Mansions"], "lookCloser": "The first half is spring weather, as ordinary as openings get. The last word breaks it. Clocks don't strike thirteen, so before you know anything else, you know this world runs on different rules. The second sentence keeps the details small and grubby, a chin tucked against the wind and grit blowing in. “Victory Mansions” is a grand name for a building the dust gets into, and that gap between name and thing runs through the book.", "stealIt": "Establish a familiar seasonal scene, then twist a single mechanical fact just beyond reality. A clock striking thirteen alerts the reader that the laws of nature and society have slipped.", "aroundIt": "Orwell wrote most of it on Jura, a remote Scottish island, while seriously ill with tuberculosis, and typed the final draft himself. It came out in June 1949. He died seven months later, aged forty-six. One title he considered was The Last Man in Europe.", "verification": "Opening paragraph, checked against published text."}, {"id": "kafka-the-trial-opening", "job": "How to put the reader on the side of the accused", "quote": "Someone must have slandered Josef K., for one morning, without having done anything truly wrong, he was arrested.", "author": "Franz Kafka", "work": "The Trial", "year": 1925, "translator": "Breon Mitchell", "highlights": ["Someone must have slandered", "without having done anything truly wrong", "he was arrested"], "lookCloser": "“Must have” is a guess. Josef K. is already trying to work out what happened, and the sentence takes his side before you've met him. “Someone” is nobody in particular, which is more frightening than a named enemy. The arrest comes last, after the excuse, the way you'd tell it if it happened to you. Mitchell chose “truly wrong” to keep a shade of doubt that's in Kafka's German. Maybe he did something slightly wrong, the way everyone has.", "stealIt": "Deduce the cause of an unjust catastrophe with detached, orderly logic. Use phrases like 'someone must have' to simulate rationality in the face of an absurd, inexplicable accusation.", "aroundIt": "Kafka never finished the novel. He left the chapters in loose bundles and asked his friend Max Brod to burn them. Brod published the book in 1925, the year after Kafka died. The two men who arrest Josef K. eat his breakfast, and nobody ever tells him what he's charged with.", "verification": "Mitchell translation, checked against published excerpts.", "lintAccepted": ["isn't X. It's Y"]}, {"id": "austen-persuasion-letter", "job": "How to write a declaration that can't wait", "quote": "I can listen no longer in silence. I must speak to you by such means as are within my reach. You pierce my soul. I am half agony, half hope. Tell me not that I am too late, that such precious feelings are gone for ever. I offer myself to you again with a heart even more your own than when you almost broke it, eight years and a half ago.", "author": "Jane Austen", "work": "Persuasion", "year": 1817, "translator": null, "highlights": ["I can listen no longer in silence.", "half agony, half hope", "eight years and a half ago"], "lookCloser": "Wentworth writes this in the same room as Anne while she's talking to someone else, and it reads like it. Short bursts, no build-up. “Half agony, half hope” splits him exactly down the middle. The most telling detail is the date. “Eight years and a half” is a man who has been counting the whole time while pretending not to care.", "stealIt": "Cut away the polite social preambles and open a critical letter with an admission that silence has become unbearable. Declare your internal division in stark, balanced opposites.", "aroundIt": "Anne broke off their engagement at nineteen, persuaded by a family friend that he had no money and no prospects. He came back from the navy rich. In this scene he sits nearby while she argues that women love longest, when hope is gone. Austen rewrote the ending. In her first version the two of them meet by chance in another house.", "verification": "Opening of Wentworth's letter. The second sentence is from memory, so check it against your copy."}, {"id": "fitzgerald-gatsby-ending", "job": "How to end on a sentence that sounds like the tide", "quote": "Gatsby believed in the green light, the orgastic future that year by year recedes before us. It eluded us then, but that's no matter—tomorrow we will run faster, stretch out our arms farther.... And one fine morning——\n\nSo we beat on, boats against the current, borne back ceaselessly into the past.", "author": "F. Scott Fitzgerald", "work": "The Great Gatsby", "year": 1925, "translator": null, "highlights": ["year by year recedes before us", "stretch out our arms farther", "borne back ceaselessly into the past"], "lookCloser": "Gatsby's dream becomes “us” in the second sentence, and suddenly you're the one reaching for the light. The dashes and dots are a sentence running out of breath mid-hope, “And one fine morning”, that never finishes. The last line rows forward against the current, and its rhythm rocks like a boat. Beat on, borne back. The sounds pull one way while the meaning pulls the other.", "stealIt": "End your next essay by turning “he” or “they” into “we” in the second-to-last line, so the reader steps into the story just before it closes.", "aroundIt": "The green light is at the end of Daisy's dock, across the bay from Gatsby's mansion, and he has been staring at it since before the book began. Nick tells the story from the Midwest, after that summer is over. The last line is carved on the gravestone Fitzgerald shares with his wife, Zelda, in Rockville, Maryland.", "verification": "Closing paragraphs, checked against published excerpts."}, {"id": "capote-in-cold-blood-opening", "job": "How to set up a crime by describing peace", "quote": "The village of Holcomb stands on the high wheat plains of western Kansas, a lonesome area that other Kansans call “out there.”", "author": "Truman Capote", "work": "In Cold Blood", "year": 1966, "translator": null, "highlights": ["the high wheat plains of western Kansas", "a lonesome area", "“out there.”"], "lookCloser": "The opening could come from a geography textbook. Wheat, plains, a direction on a map. Then “lonesome”, the one feeling word, and a nickname the rest of Kansas uses. If people in Kansas think a place is remote, it's very remote. Capote builds the emptiness first, because you need to feel how far from help this place is before he tells you what happened in it.", "stealIt": "Frame the setting of a true catastrophe through the local phrase neighbors use to set it apart. Quoting an insider nickname establishes isolation before the characters appear.", "aroundIt": "In November 1959, four members of the Clutter family were murdered in their farmhouse outside Holcomb. Capote read a short item about it in *The New York Times* and went to Kansas with his childhood friend Harper Lee as his research assistant. He spent six years on the book and called it a nonfiction novel. He never finished another one.", "verification": "Opening sentence, checked against published excerpts."}, {"id": "carver-cathedral-opening", "job": "How to reveal a narrator through his grammar", "quote": "This blind man, an old friend of my wife's, he was on his way to spend the night. His wife had died. So he was visiting the dead wife's relatives in Connecticut.", "author": "Raymond Carver", "work": "Cathedral", "year": 1983, "translator": null, "highlights": ["This blind man", "he was on his way", "the dead wife's relatives"], "lookCloser": "“This blind man” is how you'd talk about a stranger you've already decided not to like. The sentence stumbles, naming him and then starting again with “he”, the way people talk when they're irritated. “The dead wife's relatives” is cold for a man in mourning. Carver lets the narrator's grammar give away his jealousy, so you know him before he'd ever admit it, and that makes the ending hit harder.", "stealIt": "Open a story with the conversational syntax of an irritated person talking to a friend. Use casual phrasing like 'this blind man, he was' to signal resentment without formal exposition.", "aroundIt": "The blind man, Robert, and the narrator's wife have kept in touch for ten years by mailing each other tapes. Late at night, after a lot of drink, the two men try to draw a cathedral together. Carver had stopped drinking a few years before he wrote it, and he said the story felt different from anything he'd done before.", "verification": "First two sentences checked against published excerpts. Third from memory, so check it against your copy.", "lintAccepted": ["possible triad"]}, {"id": "white-once-more-to-the-lake-ending", "job": "How to end an essay with a shock", "quote": "Languidly, and with no thought of going in, I watched him, his hard little body, skinny and bare, saw him wince slightly as he pulled up around his vitals the small, soggy, icy garment. As he buckled the swollen belt suddenly my groin felt the chill of death.", "author": "E. B. White", "work": "Once More to the Lake", "year": 1941, "translator": null, "highlights": ["the small, soggy, icy garment", "suddenly my groin felt the chill of death"], "lookCloser": "Everything before the last line is lazy and warm. “Languidly” sets the pace, and the boy's wet trunks are almost comic. Then one sentence turns the whole essay. White has been mixing himself up with his son all the way through, and watching the boy shiver, he feels the cold in his own body, and the cold is death. No warning, no explanation, and the essay ends there.", "stealIt": "Write a long, relaxed paragraph about an ordinary moment, then end with one short sentence that changes what it means. Cut anything that comes after it.", "aroundIt": "In 1941 White took his son back to the lake in Maine where his own father had taken him every August as a boy. All through the essay he keeps feeling that he has become his father and his son has become him. White later revised *The Elements of Style*, the little book that tells writers to omit needless words.", "verification": "Final sentence checked against published excerpts. The sentence before it is from memory, so check it against your copy.", "lintAccepted": ["possible triad"]}, {"id": "calvino-winters-night-opening", "job": "How to talk directly to the reader", "quote": "You are about to begin reading Italo Calvino's new novel, If on a winter's night a traveler. Relax. Concentrate. Dispel every other thought. Let the world around you fade. Best to close the door; the TV is always on in the next room.", "author": "Italo Calvino", "work": "If on a winter's night a traveler", "year": 1979, "translator": "William Weaver", "highlights": ["You are about to begin reading", "Relax. Concentrate.", "the TV is always on in the next room"], "lookCloser": "The novel's first subject is you, holding the book, right now. Then it turns into instructions, short commands like a meditation teacher's. The last detail is the clever one. “The TV is always on in the next room” is so ordinary and so accurate that you feel caught. He has noticed your life, which is flattering enough that you do what he says.", "stealIt": "Address the reader directly in the second person, guiding their physical posture before the story begins. Instruct them to adjust the light, shut the door, and set aside daily distractions.", "aroundIt": "You, the Reader, are the main character. Your copy of the novel turns out to be misbound, so you go back to the bookshop and meet another reader, Ludmilla, who has the same problem. The book contains the openings of ten different novels, each broken off at a moment of suspense. Calvino never lets you finish one.", "verification": "First four sentences checked against published excerpts. The last two are from memory, so check them against your copy."}, {"id": "borges-library-of-babel-opening", "job": "How to describe an impossible place with flat precision", "quote": "The universe (which others call the Library) is composed of an indefinite and perhaps infinite number of hexagonal galleries, with vast air shafts between, surrounded by very low railings.", "author": "Jorge Luis Borges", "work": "The Library of Babel", "year": 1941, "translator": "James E. Irby", "highlights": ["(which others call the Library)", "indefinite and perhaps infinite", "very low railings"], "lookCloser": "The brackets are where Borges hides the strangeness, mentioning in passing that other people call the universe a library. “Indefinite and perhaps infinite” is a librarian being careful about a number. Then the details turn specific and practical, down to the height of the railings. The precision makes an impossible place feel surveyed.", "stealIt": "Translate an abstract philosophical realm into concrete architectural geometry. Specify the exact shape of rooms and spiral staircases. Precise physical measurements ground an infinite concept.", "aroundIt": "Borges wrote it while working as an assistant at a municipal library in Buenos Aires, a job he later called nine years of solid unhappiness. The Library holds every possible book of 410 pages, so somewhere on its shelves is the true story of your death, among countless false ones. He went blind in middle age, and in 1955 he became director of Argentina's National Library.", "verification": "Irby translation, opening sentence checked against published text."}, {"id": "sacks-my-own-life-gratitude", "job": "How to write about your own death", "quote": "I cannot pretend I am without fear. But my predominant feeling is one of gratitude. I have loved and been loved; I have been given much and I have given something in return; I have read and traveled and thought and written. I have had an intercourse with the world, the special intercourse of writers and readers. Above all, I have been a sentient being, a thinking animal, on this beautiful planet, and that in itself has been an enormous privilege and adventure.", "author": "Oliver Sacks", "work": "Gratitude", "year": 2015, "translator": null, "highlights": ["I cannot pretend I am without fear.", "I have been given much and I have given something in return", "a thinking animal, on this beautiful planet"], "lookCloser": "He starts with the fear so you'll trust the gratitude. Then comes a run of plain verbs, loved, read, traveled, thought, written, a life summed up with no achievements listed. “Given something in return” is modest, almost an accountant's phrase. The last sentence widens out to a whole species and a whole planet and lands on “adventure”, a brave word to finish on.", "stealIt": "When you next write a thank-you, a farewell or a year-end note, admit the hard thing in the first line. Then list what happened in plain verbs, with no adjectives and no awards.", "aroundIt": "Sacks wrote it for *The New York Times* in February 2015, a few weeks after learning that a rare eye cancer had spread to his liver. He was eighty-one. He borrowed the title from the short autobiography the philosopher David Hume wrote when he knew he was dying. Sacks died that August.", "verification": "First two sentences and the ending checked against published excerpts. Middle from memory, so check it against the essay."}, {"id": "angelou-caged-bird-razor", "job": "How to make a metaphor do double damage", "quote": "If growing up is painful for the Southern Black girl, being aware of her displacement is the rust on the razor that threatens the throat.", "author": "Maya Angelou", "work": "I Know Why the Caged Bird Sings", "year": 1969, "translator": null, "highlights": ["If growing up is painful", "the rust on the razor", "threatens the throat"], "lookCloser": "The first pain is granted almost in passing, “if growing up is painful”, as if that part goes without saying. The weight goes into the image. A razor at the throat is danger enough. Rust adds a second, slower harm on top of the cut, so knowing you don't belong becomes the infection after the wound. Say it aloud and listen to the r sounds scrape through rust, razor, threatens and throat.", "stealIt": "Take a lingering emotional ache and compare it to a jagged household instrument. Add a second sensory layer like rust on steel to turn discomfort into sharp peril.", "aroundIt": "The sentence closes the prologue, a short scene in which young Marguerite forgets the words of a poem in front of her church on Easter Sunday and runs out in shame. At three she and her brother were put on a train to live with their grandmother in Stamps, Arkansas. Angelou wrote the book in her early forties, after James Baldwin encouraged her to.", "verification": "End of the prologue, checked against published excerpts.", "lintAccepted": ["possible triad"]}, {"id": "karr-liars-club-opening", "job": "How to open a memoir with a memory full of holes", "quote": "My sharpest memory is of a single instant surrounded by dark. I was seven, and our family doctor knelt before me where I sat on a mattress on the bare floor.", "author": "Mary Karr", "work": "The Liars' Club", "year": 1995, "translator": null, "highlights": ["a single instant surrounded by dark", "our family doctor knelt before me", "a mattress on the bare floor"], "lookCloser": "She admits the edges are missing before she tells you anything. “Surrounded by dark” is how memory really works, one lit moment with blackness around it. Then she's exact about the part she has. A doctor kneeling, so it's serious. A mattress on the bare floor, so something has gone wrong in the house. You don't know what happened, and for a long time neither does she.", "stealIt": "When you tell a founder story, admit which part you don't remember clearly, then describe the one moment you do in exact physical detail. Being honest about the gaps makes the details believable.", "aroundIt": "Karr grew up in a refinery town in southeast Texas. The title comes from the group of men, her father among them, who met to drink and tell tall stories at the back of a bait shop. Her mother had a past she kept secret from her daughters. The book was a bestseller for more than a year and is often credited with starting the 1990s memoir boom.", "verification": "Opening, checked against published excerpts."}, {"id": "thompson-fear-and-loathing-opening", "job": "How to open at full speed", "quote": "We were somewhere around Barstow on the edge of the desert when the drugs began to take hold. I remember saying something like “I feel a bit lightheaded; maybe you should drive....” And suddenly there was a terrible roar all around us and the sky was full of what looked like huge bats, all swooping and screeching and diving around the car, which was going about a hundred miles an hour with the top down to Las Vegas.", "author": "Hunter S. Thompson", "work": "Fear and Loathing in Las Vegas", "year": 1971, "translator": null, "highlights": ["somewhere around Barstow", "maybe you should drive", "huge bats"], "lookCloser": "Thompson is precise about everything except what matters. A real town, a real desert, and then “the drugs”, plural and unexplained. “I feel a bit lightheaded; maybe you should drive” is the funniest understatement in the book, polite while the car does a hundred. Then the bats arrive, and the sentence piles “and” on “and”, so you read it at the speed of the car.", "stealIt": "Start a story mid-journey, with a real place name and one detail you don't explain. Then give someone a line that's far too calm for what's happening.", "aroundIt": "It began as an assignment from *Sports Illustrated* to write a short caption for a motorbike race in the Nevada desert. The magazine rejected the much longer piece he sent back. *Rolling Stone* ran it in two parts in 1971, under the byline Raoul Duke. The lawyer in the passenger seat is based on Oscar Zeta Acosta, a Chicano activist and attorney.", "verification": "Opening paragraph, checked against published excerpts."}, {"id": "king-on-writing-reading", "job": "How to close an argument in three words", "quote": "If you don't have time to read, you don't have the time (or the tools) to write. Simple as that.", "author": "Stephen King", "work": "On Writing: A Memoir of the Craft", "year": 2000, "translator": null, "highlights": ["(or the tools)", "Simple as that."], "lookCloser": "The sentence is built like a trap. You think it's about time, which everyone says they lack, and the brackets slip in a second, harder point. Reading is where the tools come from. Then “Simple as that” shuts the door. There's no “I think” and no room for the excuse you were forming. Three words that sound like a man putting his coffee down.", "stealIt": "After your strongest claim, add a short closer that refuses to debate it, like “Simple as that” or “That's the job.” Use it once per piece at most.", "aroundIt": "King says he reads seventy or eighty books a year, mostly fiction, and takes one everywhere, including the dentist's waiting room. He wrote his early novels in the laundry room of a rented trailer. He threw an early draft of *Carrie* in the bin, and his wife, Tabitha, fished it out and told him to finish it. It became his first published novel.", "verification": "Checked against published excerpts.", "lintAccepted": ["possible triad"]}, {"id": "palahniuk-thought-verbs", "job": "How to give advice people actually follow", "quote": "From this point forward—at least for the next half year—you may not use “thought” verbs. These include: Thinks, Knows, Understands, Realizes, Believes, Wants, Remembers, Imagines, Desires, and a hundred others you love to use.", "author": "Chuck Palahniuk", "work": "Nuts and Bolts: “Thought” Verbs", "year": 2013, "translator": null, "highlights": ["at least for the next half year", "Thinks, Knows, Understands", "a hundred others you love to use"], "lookCloser": "Most writing advice says “show, don't tell” and leaves you to guess how. Palahniuk turns it into a ban with a time limit and a list. Six months is long enough to change a habit and short enough to agree to. The capitalised verbs look like an official notice. Then “you love to use” catches you out. He knows these are your favourite words, which is why they have to go.", "stealIt": "Turn one vague line in your style guide into a ban with a list and a time limit. “For the next quarter, no ‘seamless’, ‘robust’ or ‘leverage’ in anything we publish.”", "aroundIt": "It's from a 2013 essay on LitReactor, part of a series Palahniuk wrote for new writers. His example of what to avoid is “Jim sat beside the telephone, wondering why Amanda didn't call.” He makes you rewrite it by showing what Jim does instead. The essay's title warns that in six seconds you'll hate him, and in six months you'll be a better writer.", "verification": "Checked against the LitReactor essay."}, {"id": "wallace-supposedly-fun-thing-list", "job": "How to make a list funnier with every line", "quote": "I have now seen sucrose beaches and water a very bright blue. I have seen an all-red leisure suit with flared lapels. I have smelled suntan lotion spread over 2,100 pounds of hot flesh. I have been addressed as “Mon” in three different nations.", "author": "David Foster Wallace", "work": "A Supposedly Fun Thing I'll Never Do Again", "year": 1996, "translator": null, "highlights": ["sucrose beaches", "an all-red leisure suit with flared lapels", "addressed as “Mon” in three different nations"], "lookCloser": "“Sucrose” gives it away. Sugar-white would be a postcard. Sucrose is a lab word, so the beach becomes something manufactured and a bit too sweet. Then “I have” repeats like a witness statement, and each item gets more specific and more absurd. The exact figure of 2,100 pounds is a joke disguised as evidence. By the third line you trust him completely, and he's been funny the whole time.", "stealIt": "Write five things you saw at the last conference you went to, each starting “I have seen”. Make every item more specific than the last, and use one scientific word where an ad would use a pretty one.", "aroundIt": "*Harper's* sent Wallace on a seven-night luxury cruise in the Caribbean in 1995. He came back with a piece so long the magazine ran it as “Shipping Out”, and it later gave its title to a collection of his essays. He spends pages explaining why a week of being pampered filled him with despair. His nickname for the ship, the Zenith, was the Nadir.", "verification": "First sentence checked against published excerpts. The rest of the list from memory, so check it against your copy."}, {"id": "murakami-running-pain", "job": "How to make a distinction stick", "quote": "Pain is inevitable. Suffering is optional. Say you're running and you start to think, Man, this hurts, I can't take it anymore. The hurt part is an unavoidable reality, but whether or not you can stand any more is up to the runner himself.", "author": "Haruki Murakami", "work": "What I Talk About When I Talk About Running", "year": 2007, "translator": "Philip Gabriel", "highlights": ["Pain is inevitable. Suffering is optional.", "Man, this hurts", "up to the runner himself"], "lookCloser": "Two short sentences set up the difference so neatly it sounds like a law. Then Murakami does the useful part. He puts you inside a run, thinking in your own voice, “Man, this hurts”, and splits that one thought in two. The hurt belongs to your body. The “I can't take it” belongs to you. A slogan becomes something you can use at mile twenty.", "stealIt": "Take a burdensome experience like exhaustion or grief, and divide it into two clean categories. One is physical fact; the other is mental interpretation. Defining the boundary restores agency.", "aroundIt": "Murakami ran a jazz bar in Tokyo into his thirties. He sold it in 1981 to write full time and took up running to stay in shape. He found the mantra in a newspaper piece about marathon runners. The runner who used it had learned it from his older brother. Murakami's title borrows from Raymond Carver, whose stories he translated into Japanese.", "verification": "Foreword, checked against published excerpts."}, {"id": "hemingway-farewell-broken-places", "job": "How to say something brutal in plain words", "quote": "If people bring so much courage to this world the world has to kill them to break them, so of course it kills them. The world breaks every one and afterward many are strong at the broken places. But those that will not break it kills. It kills the very good and the very gentle and the very brave impartially. If you are none of these you can be sure it will kill you too but there will be no special hurry.", "author": "Ernest Hemingway", "work": "A Farewell to Arms", "year": 1929, "translator": null, "highlights": ["strong at the broken places", "the very good and the very gentle and the very brave impartially", "no special hurry"], "lookCloser": "“Strong at the broken places” is the bit people put on greeting cards and stop at. Hemingway keeps going. The world kills the ones who won't break, and the triple “very” names the best people as its targets. The last clause is the cruellest, said almost casually. If you're none of these, you'll die too, only without the rush. The plain words make it sound like a fact instead of a mood.", "stealIt": "Find a line from your field that people quote as a slogan, and add the part they leave off. The fuller version is more honest, and readers notice who quotes the whole thing.", "aroundIt": "Frederic Henry thinks this in a hotel in Stresa with Catherine Barkley, shortly before they row across a lake to Switzerland at night to escape the war. Hemingway wrote the novel ten years after his own wounding in Italy, and finished the draft around the birth of his second son. The book's final chapter takes place in a hospital.", "verification": "Checked against published excerpts."}, {"id": "orwell-politics-english-rules", "job": "How to write rules that leave room for judgement", "quote": "Never use a metaphor, simile, or other figure of speech which you are used to seeing in print. Never use a long word where a short one will do. If it is possible to cut a word out, always cut it out. Never use the passive where you can use the active. Never use a foreign phrase, a scientific word, or a jargon word if you can think of an everyday English equivalent. Break any of these rules sooner than say anything outright barbarous.", "author": "George Orwell", "work": "Politics and the English Language", "year": 1946, "translator": null, "highlights": ["Never use a long word where a short one will do.", "If it is possible to cut a word out, always cut it out.", "outright barbarous"], "lookCloser": "The first five rules obey themselves, with short words, nothing passive and nothing you could cut. Then the sixth overrides the other five. It admits that rules can produce bad writing too, and trusts you to know when. “Barbarous” is the most unusual word in the list, picked on purpose, so even the escape clause shows you how to break a rule well.", "stealIt": "Write your next style guide as five short rules that follow themselves, then add a sixth that says when to ignore them. A guide with an exit gets followed more than one without.", "aroundIt": "Orwell published the essay in 1946, shortly before he started writing *Nineteen Eighty-Four*. Its argument is that sloppy language makes sloppy thinking easier, and that political writing hides behind vague words to defend things that couldn't be defended plainly. Newspeak, the language in *Nineteen Eighty-Four* that loses words every year, grew out of the same worry.", "verification": "The six rules, checked against published text.", "lintAccepted": ["possible triad"]}, {"id": "didion-why-i-write", "job": "How to explain why you do the work", "quote": "I write entirely to find out what I'm thinking, what I'm looking at, what I see and what it means. What I want and what I fear. Had I been blessed with even limited access to my own mind there would have been no reason to write.", "author": "Joan Didion", "work": "Why I Write", "year": 1976, "translator": null, "highlights": ["to find out what I'm thinking", "What I want and what I fear.", "no reason to write"], "lookCloser": "Most people describe writing as getting their thoughts down. For Didion the thoughts don't exist until she writes. The list moves inwards, from what she's looking at to what she sees to what it means, and then drops into a fragment about wanting and fear. The last sentence is a dry joke at her own expense. If she understood her own mind, she'd have no reason to do any of this.", "stealIt": "Before your next strategy doc, write one page only to find out what you think, and show it to nobody. The real argument usually turns up in the last paragraph.", "aroundIt": "It began as a lecture at the University of California, Berkeley, where she had studied English. She admitted she stole the title from George Orwell. One reason, she said, was that she liked the sound of the three words, because they share a sound, and the sound is I, I, I.", "verification": "First two sentences checked against published excerpts. Third from memory, so check it against the essay."}, {"id": "salinger-catcher-opening", "job": "How to give a narrator his voice in one breath", "quote": "If you really want to hear about it, the first thing you'll probably want to know is where I was born, and what my lousy childhood was like, and how my parents were occupied and all before they had me, and all that David Copperfield kind of crap, but I don't feel like going into it, if you want to know the truth. In the first place, that stuff bores me, and in the second place, my parents would have about two hemorrhages apiece if I told anything pretty personal about them.", "author": "J. D. Salinger", "work": "The Catcher in the Rye", "year": 1951, "translator": null, "highlights": ["If you really want to hear about it", "all that David Copperfield kind of crap", "about two hemorrhages apiece"], "lookCloser": "Holden refuses to start his story the way novels start, and the refusal is his introduction. The sentence rambles with “and all” and “if you want to know the truth”, the verbal tics of a sixteen-year-old trying to sound older. He name-drops Dickens only to dismiss him. Then “about two hemorrhages apiece” is pure teenage exaggeration, and by now you know exactly who's talking.", "stealIt": "Begin your next newsletter by refusing the standard opening of your genre, like “I'm not going to walk you through our Q3 results”. Then let your actual voice, tics included, take over.", "aroundIt": "Holden is telling the story from somewhere in California, months after being thrown out of his prep school just before Christmas. Most of the book covers three days on his own in New York. Salinger carried early chapters with him through the war, including the D-Day landing at Utah Beach. He stopped publishing in 1965 and refused almost every interview for the rest of his life.", "verification": "Opening paragraph, checked against published excerpts."}, {"id": "jackson-hill-house-opening", "job": "How to describe a haunted house without a single ghost", "quote": "No live organism can continue for long to exist sanely under conditions of absolute reality; even larks and katydids are supposed, by some, to dream. Hill House, not sane, stood by itself against its hills, holding darkness within; it had stood for eighty years and might stand for eighty more. Within, walls continued upright, bricks met neatly, floors were firm, and doors were sensibly shut; silence lay steadily against the wood and stone of Hill House, and whatever walked there, walked alone.", "author": "Shirley Jackson", "work": "The Haunting of Hill House", "year": 1959, "translator": null, "highlights": ["not sane", "doors were sensibly shut", "whatever walked there, walked alone"], "lookCloser": "It opens with a small lecture on dreaming, which tells you that reality with no escape drives things mad. Then Jackson applies it to a building. “Not sane” is a diagnosis for a house. The middle is almost reassuring, walls upright, bricks neat, doors “sensibly” shut, so the menace comes from how normal everything is. The last clause gives you something walking with no name and no shape, and leaves you alone with it.", "stealIt": "Formulate a clinical, biological principle about the limits of the human mind. Mention insects or birds dreaming to establish scientific breadth before turning the lens on a haunted house.", "aroundIt": "Four people come to stay at Hill House to look for evidence of the supernatural, invited by a doctor who has rented it for the summer. One of them, Eleanor, has spent eleven years nursing her mother and has never really been anywhere. The novel's last paragraph repeats this first one almost word for word, with one change that matters.", "verification": "Opening paragraph, checked against published excerpts."}, {"id": "ernaux-the-years-opening", "job": "How to open a life story with its ending", "quote": "All the images will disappear.", "author": "Annie Ernaux", "work": "The Years", "year": 2008, "translator": "Alison L. Strayer", "highlights": ["All the images will disappear."], "lookCloser": "Five words, and the whole book is already in danger. “All” is total. “Images” covers memories, photographs, adverts, faces, everything. The future tense makes it certain. Most memoirs begin by holding on to the past. Ernaux begins by admitting none of it will survive, which turns everything that follows into a rescue.", "stealIt": "Begin a personal history with a sweeping, five-word prophecy of total erasure. List the fleeting private images that will vanish when you die, reminding the reader why memory must be written down.", "aroundIt": "*The Years* tells the life of a woman born in 1940, and of France around her, from the war to the 2000s, without ever using the word “I”. It's written as “she” and “we”, and built from photographs, songs, adverts and things people said at family meals. Ernaux won the Nobel Prize in Literature in 2022.", "verification": "Opening line, Strayer translation.", "lintAccepted": ["possible triad"]}, {"id": "davis-the-outing", "job": "How to tell a whole story in one sentence", "quote": "An outburst of anger near the road, a refusal to speak on the path, a silence in the pine woods, a silence across the old railroad bridge, an attempt to be friendly in the water, a refusal to end the argument on the flat stones, a cry of anger on the steep bank of dirt, a weeping among the bushes.", "author": "Lydia Davis", "work": "The Outing", "year": 1986, "translator": null, "highlights": ["An outburst of anger near the road", "an attempt to be friendly in the water", "a weeping among the bushes"], "lookCloser": "There's no main verb anywhere, only feelings pinned to places. Each phrase is a stage of a fight you could follow on a map, from road to path to woods to bridge to water. “An attempt to be friendly in the water” is the one hopeful moment, and it fails. You never learn who argued or why. The places do the work, and you supply the rest from your own worst day out.", "stealIt": "Isolate a minor involuntary bodily twitch, like a fluttering eyelid. Give it two divergent interpretations in adjacent clauses, spanning mortal terror and everyday fatigue. The contrast creates immediate psychological comedy.", "aroundIt": "That's the whole story. Davis is known for fiction that runs a paragraph, a sentence, or sometimes a title and one line. She is also a celebrated translator, and her English version of Proust's *Swann's Way* came out in 2002. She won the Man Booker International Prize in 2013.", "verification": "Complete story, checked against published text."}, {"id": "smith-white-teeth-opening", "job": "How to open a comedy with a man trying to die", "quote": "Early in the morning, late in the century, Cricklewood Broadway. At 06.27 hours on 1 January 1975, Alfred Archibald Jones was dressed in corduroy and sat in a fume-filled Cavalier Musketeer Estate face down on the steering wheel, hoping the judgement would not be too heavy upon him.", "author": "Zadie Smith", "work": "White Teeth", "year": 2000, "translator": null, "highlights": ["Early in the morning, late in the century", "06.27 hours", "hoping the judgement would not be too heavy upon him"], "lookCloser": "“Early in the morning, late in the century” is a joke and a timestamp at once. Then comes the precision of a police report, 06.27 hours, a named car model, corduroy. Archie is trying to gas himself, and Smith describes it in the voice of a man filling in a form. The last clause gives him away. Even facing death, he hopes not to be judged too harshly, which is the most Archie thing he could hope for.", "stealIt": "Pair two contrasting time scales in your opening line, matching the hour of day with the span of a century. Let the rhyming syllables create musical momentum before introducing an unfortunate protagonist.", "aroundIt": "A butcher clearing his doorway saves him, because the shop won't have suicides on its premises. Archie takes it as a sign and soon remarries. Smith wrote much of the novel while still a student at Cambridge, and it came out in 2000, when she was twenty-four.", "verification": "Opening checked against published excerpts. Check the exact wording of the last clause against your copy."}, {"id": "ferrante-brilliant-friend-childhood", "job": "How to describe a hard childhood without self-pity", "quote": "I feel no nostalgia for our childhood: it was full of violence. Every sort of thing happened, at home and outside, every day, but I don't recall having ever thought that the life we had there was particularly bad.", "author": "Elena Ferrante", "work": "My Brilliant Friend", "year": 2011, "translator": "Ann Goldstein", "highlights": ["I feel no nostalgia", "full of violence", "particularly bad"], "lookCloser": "She shuts the door on nostalgia in the first five words. Then the second sentence does something stranger. It treats violence like everyday weather, at home, outside, every day, and admits nobody at the time thought it unusual. “Particularly bad” is the understatement that hurts. A child who doesn't know her life is bad is the saddest thing in the paragraph.", "stealIt": "Depict extreme hardship or violence without moral indignation. Describe bruises, wounds, and feuds through a child's matter-of-fact observation, showing how quickly horror becomes routine background noise.", "aroundIt": "Elena is writing at sixty-six, after her childhood friend Lila has vanished and taken every trace of herself with her, even cutting her own face out of photographs. The four Neapolitan novels follow the two of them from a poor neighbourhood in Naples across sixty years. Elena Ferrante is a pen name, and the author has never appeared in public.", "verification": "First sentence checked against published excerpts. Second from memory, so check it against your copy.", "lintAccepted": ["possible triad"]}, {"id": "moshfegh-eileen-opening", "job": "How to introduce a narrator who has studied her own dullness", "quote": "I looked like a girl you'd expect to see on a city bus, reading some clothbound book from the library about plants or geography, perhaps wearing a net over my light brown hair.", "author": "Ottessa Moshfegh", "work": "Eileen", "year": 2015, "translator": null, "highlights": ["a girl you'd expect to see on a city bus", "clothbound book from the library about plants or geography", "a net over my light brown hair"], "lookCloser": "She describes herself as a stranger would see her, as a type. Every detail is chosen to be forgettable. A bus, a library book on a dull subject, a hairnet, light brown hair. She's building the most invisible woman possible, and the precision gives her away. Nobody that invisible knows so exactly how they look, and you can feel how carefully she has studied it.", "stealIt": "Open an autobiographical account with an uncompromising comparative insult directed at your younger self. Admitting you were once even more unpleasant establishes immediate intimacy through harsh honesty.", "aroundIt": "Eileen is twenty-four in 1964, working as a secretary at a prison for boys in a grim New England town and looking after her father, a retired policeman who drinks. She's telling the story fifty years later. Early on she lets slip that within a week of these events she disappeared.", "verification": "Opening sentence, checked against published excerpts."}, {"id": "lahiri-third-and-final-continent-ending", "job": "How to make an ordinary life feel enormous", "quote": "While the astronauts, heroes forever, spent mere hours on the moon, I have remained in this new world for nearly thirty years. I know that my achievement is quite ordinary. I am not the only man to seek his fortune far from home, and certainly I am not the first. Still, there are times I am bewildered by each mile I have traveled, each meal I have eaten, each person I have known, each room in which I have slept. As ordinary as it all appears, there are times when it is beyond my imagination.", "author": "Jhumpa Lahiri", "work": "The Third and Final Continent", "year": 1999, "translator": null, "highlights": ["spent mere hours on the moon", "quite ordinary", "each room in which I have slept"], "lookCloser": "He measures his life against the moon landing and admits, twice, that his is smaller. Then “Still” turns the paragraph. What follows is a list of ordinary nouns, miles, meals, people, rooms, and the “each” in front of every one makes you count them. By the end, ordinary and unimaginable have become the same thing. The modesty is what makes the wonder believable.", "stealIt": "Close a reflective memoir by repeating 'each' across expanding categories, moving from physical distance to daily meals to human bonds. The steady cadence turns personal biography into quiet wonder.", "aroundIt": "It's the end of the last story in *Interpreter of Maladies*, Lahiri's first book. A young Bengali man arrives in Massachusetts in 1969, the week of the moon landing, and rents a room from a woman who is 103 years old. The book won the Pulitzer Prize for Fiction in 2000, when Lahiri was thirty-two.", "verification": "Closing paragraph, checked against published excerpts.", "lintAccepted": ["possible triad"]}, {"id": "vonnegut-slaughterhouse-five-opening", "job": "How to admit you're bending the truth and earn more trust", "quote": "All this happened, more or less. The war parts, anyway, are pretty much true. One guy I knew really was shot in Dresden for taking a teapot that wasn't his.", "author": "Kurt Vonnegut", "work": "Slaughterhouse-Five", "year": 1969, "translator": null, "highlights": ["All this happened, more or less.", "pretty much true", "taking a teapot that wasn't his"], "lookCloser": "Three hedges in a row, “more or less”, “anyway”, “pretty much”, and somehow they make you believe him more. He's telling you which parts to trust. Then he proves it with the most absurd true detail he has. A man survives the firebombing of a city and is shot for taking a teapot. The flat, chatty voice makes that land harder than outrage would.", "stealIt": "Introduce a traumatic historical narrative with an informal shrug about accuracy. Qualify your claims with 'more or less' and 'pretty much true'. The conversational hedge disarms skepticism better than a solemn guarantee.", "aroundIt": "Vonnegut was a prisoner of war in Dresden in February 1945, sheltering in a slaughterhouse meat locker when Allied bombers destroyed the city. He spent more than twenty years trying to write about it. The book's hero, Billy Pilgrim, has come unstuck in time. Every time someone dies in the novel, Vonnegut writes “So it goes.”", "verification": "Opening, checked against published excerpts."}, {"id": "morrison-nobel-lecture", "job": "How to build a pair of sentences that stays with people", "quote": "We die. That may be the meaning of life. But we do language. That may be the measure of our lives.", "author": "Toni Morrison", "work": "Nobel Lecture", "year": 1993, "translator": null, "highlights": ["We die.", "we do language", "the measure of our lives"], "lookCloser": "Two pairs of sentences with the same shape, and the second pair answers the first. “We die” is the shortest possible sentence about the biggest fact. Then she bends grammar on purpose. Nobody “does” language in everyday English, and the odd verb turns speaking into an act, something you make and answer for. Meaning and measure sound alike, and only the second is in our hands.", "stealIt": "Write two short pairs of sentences with the same shape, where the second pair answers the first. Bend one verb slightly so readers notice it.", "aroundIt": "Morrison gave the lecture in Stockholm in December 1993, the first Black woman to win the Nobel Prize in Literature. Most of it is a fable about an old, blind, wise woman and some young people who try to trick her with a bird they say they're holding. She tells them she doesn't know whether the bird is alive or dead, only that it's in their hands.", "verification": "Nobel Lecture, 1993, checked against published text.", "lintAccepted": ["possible triad"]}, {"id": "chekhov-gooseberries-hammer", "job": "How to argue for empathy with one image", "quote": "Behind the door of every contented, happy man there ought to be someone standing with a little hammer and continually reminding him with a knock that there are unhappy people, that however happy he may be, life will sooner or later show him its claws, and trouble will come to him—illness, poverty, losses, and then no one will see or hear him, just as now he neither sees nor hears others.", "author": "Anton Chekhov", "work": "Gooseberries", "year": 1898, "translator": null, "highlights": ["someone standing with a little hammer", "life will sooner or later show him its claws", "he neither sees nor hears others"], "lookCloser": "The image is almost comic, a little figure behind a door, tapping with a hammer. That's why it sticks. An argument about privilege would slide off you. A knock at the door you can hear. Then the sentence turns on the happy man himself. Trouble is coming for him too, and the last clause hands him exactly the deafness he's showing now.", "stealIt": "When you need people to care about a problem that isn't theirs, invent one small physical reminder for it, like the hammer. Something they could picture on their desk tomorrow.", "aroundIt": "Ivan Ivanovich says this after visiting his brother, a clerk who scrimped for decades, married a rich widow for her money and finally bought a small estate with gooseberry bushes. The berries are hard and sour. That night Ivan hears his brother get up again and again to eat them, delighted. Chekhov, a doctor, treated local peasants for free at his own estate near Moscow.", "verification": "Wording varies between translations, so check it against your edition."}, {"id": "woolf-room-of-ones-own", "job": "How to make a radical argument sound modest", "quote": "All I could do was to offer you an opinion upon one minor point—a woman must have money and a room of her own if she is to write fiction; and that, as you will see, leaves the great problem of the true nature of woman and the true nature of fiction unsolved.", "author": "Virginia Woolf", "work": "A Room of One's Own", "year": 1929, "translator": null, "highlights": ["one minor point", "money and a room of her own", "unsolved"], "lookCloser": "She calls it “one minor point”, and it's the whole book. The modesty is strategic. The big questions about the nature of women and of fiction are politely set aside as unsolvable. What's left is something nobody can argue with, money and a door that locks. A practical demand is harder to dismiss than a grand theory, and Woolf knows it.", "stealIt": "Present your boldest recommendation as a small, practical point and leave the big theory unsolved on purpose. “I can't tell you how to fix the culture. I can tell you to cancel Friday meetings.”", "aroundIt": "The book began as two lectures Woolf gave in October 1928 at Newnham and Girton, the women's colleges at Cambridge. In it she invents Shakespeare's equally gifted sister, Judith, and follows what would have happened to her. The narrator's own freedom comes from an aunt who died after a fall from her horse in Bombay and left her five hundred pounds a year.", "verification": "Checked against published text.", "lintAccepted": ["possible triad"]}, {"id": "plath-bell-jar-fig-tree", "job": "How to turn indecision into a picture", "quote": "I saw my life branching out before me like the green fig tree in the story. From the tip of every branch, like a fat purple fig, a wonderful future beckoned and winked. One fig was a husband and a happy home and children, and another fig was a famous poet and another fig was a brilliant professor, and another fig was Ee Gee, the amazing editor … and another fig was an Olympic lady crew champion, and beyond and above these figs were many more figs I couldn't quite make out. I saw myself sitting in the crotch of this fig tree, starving to death, just because I couldn't make up my mind which of the figs I would choose. I wanted each and every one of them, but choosing one meant losing all the rest, and, as I sat there, unable to decide, the figs began to wrinkle and go black, and, one by one, they plopped to the ground at my feet.", "author": "Sylvia Plath", "work": "The Bell Jar", "year": 1963, "translator": null, "highlights": ["like a fat purple fig", "an Olympic lady crew champion", "plopped to the ground at my feet"], "lookCloser": "Plath turns a vague feeling, too many choices, into a tree you can see. The list keeps going with “and another fig was”, so you feel the abundance before the cost. The futures get funnier as they go, ending on an Olympic lady crew champion. Then she's starving in the middle of all that fruit. “Plopped” is the cruellest word, nearly comic, because nothing grand happens to the lives she didn't choose. They just fall.", "stealIt": "Represent paralyzing life choices as ripe figs on a spreading tree. Give each branch a distinct path, and describe the agony of starving while watching the fruit turn black and fall.", "aroundIt": "“Ee Gee, the amazing editor” is Esther herself, by her initials. The passage is usually quoted online as a thought about choice and cut off before the figs rot. Plath based Esther's summer on her own month as a guest editor at *Mademoiselle* in 1953. The novel wasn't published in the United States until 1971, eight years after her death.", "verification": "Checked against published excerpts. Part of the list of figs is cut, marked with an ellipsis.", "lintAccepted": ["isn't X. It's Y"]}, {"id": "nabokov-speak-memory-opening", "job": "How to make a cosmic thought physical", "quote": "The cradle rocks above an abyss, and common sense tells us that our existence is but a brief crack of light between two eternities of darkness. Although the two are identical twins, man, as a rule, views the prenatal abyss with more calm than the one he is heading for (at some forty-five hundred heartbeats an hour).", "author": "Vladimir Nabokov", "work": "Speak, Memory", "year": 1951, "translator": null, "highlights": ["The cradle rocks above an abyss", "a brief crack of light", "forty-five hundred heartbeats an hour"], "lookCloser": "A cradle, a crack of light and an abyss build the biggest idea there is out of things you could draw. “Common sense tells us” sounds reasonable, then hands you darkness on both sides. The second sentence is pure Nabokov. Two identical eternities, and we only fear the one ahead. Then the brackets give our speed of travel in heartbeats, noted like a scientist's reading.", "stealIt": "Put one precise, slightly scientific measurement in brackets after an emotional sentence. The bracket makes the feeling feel true.", "aroundIt": "He goes on to describe a young man who watched home movies made weeks before he was born, and panicked at the sight of an empty pram on the porch, as if it were a coffin. The book covers Nabokov's childhood in a wealthy family in St Petersburg, which ended with the Revolution and exile. His father was shot dead in Berlin in 1922 while shielding another man from an assassin.", "verification": "First sentence checked against published excerpts. Second from memory, so check it against your copy."}, {"id": "garcia-marquez-cholera-opening", "job": "How to open with a smell that hides a death", "quote": "It was inevitable: the scent of bitter almonds always reminded him of the fate of unrequited love.", "author": "Gabriel García Márquez", "work": "Love in the Time of Cholera", "year": 1985, "translator": "Edith Grossman", "highlights": ["It was inevitable", "the scent of bitter almonds", "unrequited love"], "lookCloser": "“It was inevitable” announces a law before you know what it governs. Then comes a smell, and a romantic-sounding one. Bitter almonds could belong in a love story. They are also the smell of cyanide, and the doctor who notices it is standing over a man who has just killed himself. García Márquez puts poison and longing in the same sentence and lets you smell both.", "stealIt": "Open with a sensory detail that means two things at once, one pleasant and one ominous. Let the second meaning arrive a paragraph later.", "aroundIt": "The doctor is Juvenal Urbino, and the dead man is his friend, a photographer who chose to die rather than grow old. That same afternoon Urbino dies too, falling from a ladder while trying to catch his parrot. His widow, Fermina Daza, is then courted again by a man who has waited fifty-one years, nine months and four days for her.", "verification": "Grossman translation, opening sentence checked.", "lintAccepted": ["possible triad"]}, {"id": "hemingway-iceberg", "job": "How to explain the power of leaving things out", "quote": "If a writer of prose knows enough about what he is writing about he may omit things that he knows and the reader, if the writer is writing truly enough, will have a feeling of those things as strongly as though the writer had stated them. The dignity of movement of an ice-berg is due to only one-eighth of it being above water.", "author": "Ernest Hemingway", "work": "Death in the Afternoon", "year": 1932, "translator": null, "highlights": ["he may omit things that he knows", "writing truly enough", "only one-eighth of it being above water"], "lookCloser": "The first sentence sets a condition. You may only leave out what you actually know. The reader can feel the weight of material that was cut, and can tell when nothing was there to cut. Then the iceberg makes the theory visible, and “dignity of movement” is the clever part. The hidden seven-eighths are what make the visible part move with weight.", "stealIt": "Draft a scene with deep emotional resonance, then delete the explanatory lines describing how the characters feel. If the physical dialogue is accurate, the unspoken tension will register with double intensity.", "aroundIt": "*Death in the Afternoon* is mostly a book about bullfighting, written after years of following the fights in Spain, and the iceberg turns up in the middle of it. In *A Moveable Feast*, Hemingway says he left the real ending out of his early story “Out of Season”, an old man hanging himself, on exactly this principle.", "verification": "Checked against published excerpts."}, {"id": "king-gunslinger-opening", "job": "How to fit a whole story into twelve words", "quote": "The man in black fled across the desert, and the gunslinger followed.", "author": "Stephen King", "work": "The Gunslinger", "year": 1982, "translator": null, "highlights": ["The man in black fled", "and the gunslinger followed"], "lookCloser": "Two characters, a setting, a chase and a mystery, in twelve words. Neither man has a name, only a description, so you already want to know who they are. “Fled” says the man in black is afraid, or wants to look it. “Followed” is calm and patient. The pursuer walks. That difference between two verbs is a whole relationship.", "stealIt": "Establish an entire saga in eleven words by balancing two anonymous figures across a desolate expanse. One flees, the other follows. Two strong verbs create an immediate engine of pursuit.", "aroundIt": "King wrote the line in 1970, at twenty-two, on a ream of bright green paper he'd found. It became the first sentence of the Dark Tower series, which he didn't finish until 2004, spurred on by the van accident that nearly killed him. He has called the series the Jupiter of his imaginative universe.", "verification": "Opening line, checked against published text.", "lintAccepted": ["possible triad"]}, {"id": "kafka-letter-axe", "job": "How to make a case with violent metaphors", "quote": "I think we ought to read only the kind of books that wound and stab us. If the book we're reading doesn't wake us up with a blow on the head, what are we reading it for? … A book must be the axe for the frozen sea inside us.", "author": "Franz Kafka", "work": "Letter to Oskar Pollak", "year": 1904, "translator": "Richard and Clara Winston", "highlights": ["wound and stab us", "a blow on the head", "the axe for the frozen sea inside us"], "lookCloser": "Kafka is twenty, writing to a friend, and every image is violent, from wounding and stabbing to a blow on the head. Then the last metaphor changes direction. An axe on a frozen sea breaks through something cold so that what's underneath can move again. The violence was aimed at the ice all along.", "stealIt": "Define the purpose of your essay or story with an uncompromising physical instrument. Compare the reader's complacency to a frozen sea, and let your words serve as the blunt axe that cracks it.", "aroundIt": "He wrote it in January 1904 to his school friend Oskar Pollak, after reading the diaries of the poet Friedrich Hebbel, around 1,800 pages of them. Kafka was studying law in Prague and had published nothing. Pollak became an art historian and was killed in the First World War.", "verification": "Letter of 27 January 1904. Part of the letter is cut, marked with an ellipsis. Wording varies between translations.", "lintAccepted": ["possible triad"]}, {"id": "austen-emma-opening", "job": "How to introduce a heroine who's about to be humbled", "quote": "Emma Woodhouse, handsome, clever, and rich, with a comfortable home and happy disposition, seemed to unite some of the best blessings of existence; and had lived nearly twenty-one years in the world with very little to distress or vex her.", "author": "Jane Austen", "work": "Emma", "year": 1815, "translator": null, "highlights": ["handsome, clever, and rich", "seemed to unite", "very little to distress or vex her"], "lookCloser": "Every word is a compliment, and “seemed” undoes them all. Austen lists Emma's advantages in a confident rhythm, then slips in the one verb that tells you appearances are about to fail. “Very little to distress or vex her” is a sentence waiting to be broken. Twenty-one easy years are the setup, and the novel presents the bill.", "stealIt": "Shower your protagonist with enviable gifts in your opening sentence, then slip a single doubtful word like 'seemed' into the catalog. The faint doubt hints at the inevitable downfall.", "aroundIt": "Austen said she was writing a heroine whom nobody but herself would much like. Emma spends the book matchmaking for other people and misreading every one of them, herself included. It was dedicated, at his request, to the Prince Regent, whom Austen disliked.", "verification": "Opening sentence, standard text."}, {"id": "camus-sisyphus-ending", "job": "How to end an argument on a surprise", "quote": "The struggle itself toward the heights is enough to fill a man's heart. One must imagine Sisyphus happy.", "author": "Albert Camus", "work": "The Myth of Sisyphus", "year": 1942, "translator": "Justin O'Brien", "highlights": ["The struggle itself", "enough to fill a man's heart", "One must imagine Sisyphus happy."], "lookCloser": "Sisyphus is the classic picture of pointless work, pushing a boulder uphill forever. Camus spends a whole essay on whether life is worth living and ends on the least expected word, “happy”. “One must imagine” is careful. He can't prove it, so he asks you to do the imagining yourself, which makes it a choice you make.", "stealIt": "Close an argument with a startling imperative that defies common sense. State it in five simple words without defensive explanations. Let the reader contemplate the paradoxical triumph.", "aroundIt": "The essay opens by declaring that there is only one really serious philosophical problem, and that is suicide. Camus published it in 1942, the same year as *The Stranger*. He later edited *Combat*, a resistance newspaper in occupied Paris.", "verification": "O'Brien translation, closing lines checked."}, {"id": "burkeman-four-thousand-weeks-results", "job": "How to make a sentence argue with itself", "quote": "Results aren't everything. Indeed, they'd better not be, because results always come later, and later is always too late.", "author": "Oliver Burkeman", "work": "Four Thousand Weeks", "year": 2021, "translator": null, "highlights": ["Results aren't everything.", "they'd better not be", "later is always too late"], "lookCloser": "It opens on a cliché you've heard from every coach. Then “Indeed, they'd better not be” turns the cliché into a warning, in a tone close to a nervous laugh. The logic tightens like a knot. Results come later, and later never arrives, because when it does it's just another now. “Always” appears twice, so there's no escape clause.", "stealIt": "Take a cliché your audience nods along to, like “it's a marathon, not a sprint”, and follow it with “Indeed” and the uncomfortable consequence nobody says out loud.", "aroundIt": "The line comes from Burkeman's argument that we treat the present as a means to some future payoff, so we never actually live in it. He borrows the idea of “atelic” activities from the philosopher Kieran Setiya, things done for their own sake, like a walk with no destination. Most of our working lives, he argues, are spent on the other kind, done only to get them finished.", "verification": "Checked against published excerpts.", "lintAccepted": ["isn't X. It's Y"]}, {"id": "burkeman-four-thousand-weeks-capacities", "job": "How to state the whole problem in one sentence", "quote": "We've been granted the mental capacities to make almost infinitely ambitious plans, yet practically no time at all to put them into action.", "author": "Oliver Burkeman", "work": "Four Thousand Weeks", "year": 2021, "translator": null, "highlights": ["almost infinitely ambitious plans", "practically no time at all"], "lookCloser": "The sentence is built as a mismatch, like a cruel joke from the universe. “Granted” makes our minds sound like a gift, and “almost infinitely” makes the gift absurdly large. Then “yet” lowers the boom, and the second half is all smallness, “practically no time at all”. The two halves are deliberately unequal in size, which is exactly the problem he's describing.", "stealIt": "Frame a core dilemma as a cruel disproportion between mind and body. Use 'yet' to pivot from infinite mental ambition to the severe physical limits of time and endurance.", "aroundIt": "Burkeman notes that philosophers from ancient Greece onwards have treated the shortness of life as the central human problem. Seneca wrote a whole essay about it, *On the Shortness of Life*, arguing that life is long enough if you know how to use it. *Four Thousand Weeks* picks up the same problem nearly two thousand years later and reaches a less comforting answer.", "verification": "Checked against published excerpts."}, {"id": "burkeman-four-thousand-weeks-trap", "job": "How to argue against what your reader wants", "quote": "Productivity is a trap. Becoming more efficient just makes you more rushed, and trying to clear the decks simply makes them fill up again faster.", "author": "Oliver Burkeman", "work": "Four Thousand Weeks", "year": 2021, "translator": null, "highlights": ["Productivity is a trap.", "more rushed", "fill up again faster"], "lookCloser": "“Trap” is the exact word. A trap uses your own movement against you, and both halves of the next sentence describe that. The harder you pull, the tighter it gets. Efficiency produces rush and clearing produces filling. Burkeman has no quarrel with getting things done. His target is the effort to escape busyness, which turns out to be what keeps you in it.", "stealIt": "Attack a universally praised virtue, like efficiency or discipline, in a four-word opening verdict. Show how optimizing the habit merely accelerates the treadmill, leaving the practitioner more overwhelmed than before.", "aroundIt": "Burkeman calls this the efficiency trap. One of his examples is email. Get faster at answering it and you mostly teach people that you answer fast, so more of it arrives. The idea has an older cousin in Parkinson's law, a 1955 observation in *The Economist* that work expands so as to fill the time available for its completion.", "verification": "Checked against published excerpts."}, {"id": "lamott-perfectionism", "job": "How to attack a virtue", "quote": "Perfectionism is the voice of the oppressor, the enemy of the people. It will keep you cramped and insane your whole life, and it is the main obstacle between you and a shitty first draft.", "author": "Anne Lamott", "work": "Bird by Bird", "year": 1994, "translator": null, "highlights": ["the voice of the oppressor, the enemy of the people", "cramped and insane", "a shitty first draft"], "lookCloser": "Perfectionism is usually treated as a flaw people confess with pride. Lamott gives it the language of a revolution, an oppressor and an enemy of the people, which is so over the top it's funny. Then she brings it down to earth with “cramped and insane”. The punchline is the goal she sets. Perfectionism stands between you and something bad, a shitty first draft, which is exactly what you need.", "stealIt": "Pick a quality your audience is proud of, like being thorough, and describe it in the language of a villain. Then name the messy thing it's stopping them from doing.", "aroundIt": "The chapter before this one is called “Shitty First Drafts”, and it's assigned in writing classes everywhere. Lamott describes writing food reviews early in her career, and how her first drafts of them were long, overwrought and terrible. She's also written several books about faith, which she came to after years of drinking.", "verification": "First two sentences checked against published excerpts. The final clause is from memory, so check it against your copy.", "lintAccepted": ["possible triad"]}, {"id": "dillard-spend-it-all", "job": "How to give advice that sounds like a dare", "quote": "One of the few things I know about writing is this: spend it all, shoot it, play it, lose it, all, right away, every time. Do not hoard what seems good for a later place in the book, or for another book; give it, give it all, give it now. The impulse to save something good for a better place later is the signal to spend it now. Something more will arise for later, something better. These things fill from behind, from beneath, like well water.", "author": "Annie Dillard", "work": "The Writing Life", "year": 1989, "translator": null, "highlights": ["spend it all, shoot it, play it, lose it", "give it, give it all, give it now", "like well water"], "lookCloser": "It starts with a string of verbs from a gambler, spend, shoot, play, lose, and the rush of commas makes you feel the recklessness. Then she gives the rule a test you can use. The urge to save something is itself the sign to use it. The last image is the reassurance. Ideas refill from below, like water in a well, so spending them is how you get more.", "stealIt": "Put your best example in the first paragraph of your next piece, not the last. If you're tempted to save a good line for a future post, use it today.", "aroundIt": "Dillard wrote *The Writing Life* about the daily grind of making books, and she's harsh about it. She describes a work in progress as something that turns feral if you don't visit it every day, and tells how she learned to split wood by aiming past the log at the block beneath it. She advises writers to work in a room with no view.", "verification": "Checked against published excerpts.", "lintAccepted": ["possible triad"]}, {"id": "hurston-their-eyes-opening", "job": "How to open a novel with a parable", "quote": "Ships at a distance have every man's wish on board. For some they come in with the tide. For others they sail forever on the horizon, never out of sight, never landing until the Watcher turns his eyes away in resignation, his dreams mocked to death by Time. That is the life of men. Now, women forget all those things they don't want to remember, and remember everything they don't want to forget. The dream is the truth. Then they act and do things accordingly.", "author": "Zora Neale Hurston", "work": "Their Eyes Were Watching God", "year": 1937, "translator": null, "highlights": ["Ships at a distance have every man's wish on board.", "remember everything they don't want to forget", "The dream is the truth."], "lookCloser": "Men's dreams are ships on the horizon, things you wait for and watch. Then “Now, women” turns the paragraph like a preacher changing direction. Women's dreams are about memory, and the sentence about forgetting and remembering folds back on itself. “The dream is the truth” is three words long and flatly certain. Waiting is the men's half. Acting is the women's.", "stealIt": "Open your next piece with a short parable that contrasts two ways of behaving, then say plainly which one your reader should choose. Keep the parable to three sentences.", "aroundIt": "Janie Crawford is walking back into her Florida town, alone and in overalls, while the neighbours sit on their porches judging her. The rest of the novel is the story she tells her best friend about where she's been. Hurston wrote it in about seven weeks in Haiti in 1936. She died poor in 1960 and was buried in an unmarked grave until Alice Walker went looking for it in 1973.", "verification": "Opening paragraph. First sentence checked against published excerpts, the rest from memory, so check it against your copy.", "lintAccepted": ["possible triad"]}, {"id": "mccarthy-blood-meridian-opening", "job": "How to introduce a character like a painting", "quote": "See the child. He is pale and thin, he wears a thin and ragged linen shirt. He stokes the scullery fire. Outside lie dark turned fields with rags of snow and darker woods beyond that harbor yet a few last wolves. His folk are known for hewers of wood and drawers of water but in truth his father has been a schoolmaster. He lies in drink, he quotes from poets whose names are now lost.", "author": "Cormac McCarthy", "work": "Blood Meridian", "year": 1985, "translator": null, "highlights": ["See the child.", "rags of snow", "a few last wolves"], "lookCloser": "“See the child” is an order, like a guide pointing at a picture. McCarthy writes in the present tense, so you're standing in the room. The landscape outside is a set of warnings, with “rags of snow” and woods that still hide the last wolves. Then the family history is given in biblical phrasing, hewers of wood and drawers of water, with a twist. His father was a schoolmaster who drinks, and the poets he quotes have been forgotten.", "stealIt": "Start a profile with a two-word command, like “Meet Dana.” or “Picture the office.” Then give three present-tense details before you say anything about them.", "aroundIt": "The child is fourteen when he runs away from Tennessee, and the book follows him to the Mexican border in the 1840s, where he joins a gang paid to collect scalps. The gang was real. McCarthy spent years researching it, including learning Spanish. A gigantic, hairless man called the Judge, who says he will never die, is the book's centre.", "verification": "Opening paragraph, checked against published excerpts."}, {"id": "orwell-why-i-write-windowpane", "job": "How to describe a style in one image", "quote": "One can write nothing readable unless one constantly struggles to efface one's own personality. Good prose is like a windowpane.", "author": "George Orwell", "work": "Why I Write", "year": 1946, "translator": null, "highlights": ["constantly struggles", "efface one's own personality", "like a windowpane"], "lookCloser": "“Constantly struggles” admits it's hard. Orwell doesn't claim to have done it, only to keep trying. Then the windowpane does the explaining. You look through a good window at the view, and you only notice the glass when it's dirty. The image is itself an example of the advice. It's plain, it gets out of the way, and you'll remember it.", "stealIt": "Review a drafted passage and circle every phrase where the author's performance obscures the subject matter. Polish the sentences until the ego disappears, leaving only clear glass between reader and world.", "aroundIt": "In the same essay, Orwell lists four motives for writing, and he puts “sheer egoism” first. He admits he wanted to be a writer from the age of five or six. He also says that when his books lacked a political purpose, they turned out lifeless. He wrote it in 1946, the year he started work on *Nineteen Eighty-Four*.", "verification": "Checked against published excerpts."}, {"id": "palahniuk-fight-club-timeline", "job": "How to say something huge in jargon", "quote": "On a long enough time line, the survival rate for everyone drops to zero.", "author": "Chuck Palahniuk", "work": "Fight Club", "year": 1996, "translator": null, "highlights": ["On a long enough time line", "the survival rate", "drops to zero"], "lookCloser": "It's mortality explained in the language of an actuary. “Time line”, “survival rate”, “drops to zero” are words from a risk report, which suits a narrator whose job is calculating whether recalls are cheaper than lawsuits. The dry vocabulary makes the thought colder and funnier. Nobody can argue with the maths, which is the frightening part.", "stealIt": "Express an existential truth about human mortality in the cold, mathematical language of risk assessment. The clinical terminology makes the inevitability hit harder than poetic lament.", "aroundIt": "The line comes back more than once in the novel, like a refrain. Palahniuk has said many of the book's details came from stories friends told him and from his job at Freightliner, where he wrote repair manuals. The narrator describes himself as feeling like a copy of a copy of a copy.", "verification": "Checked against published excerpts."}, {"id": "didion-on-self-respect", "job": "How to define a slippery word", "quote": "Character—the willingness to accept responsibility for one's own life—is the source from which self-respect springs.", "author": "Joan Didion", "work": "On Self-Respect", "year": 1961, "translator": null, "highlights": ["the willingness to accept responsibility for one's own life", "the source from which self-respect springs"], "lookCloser": "Self-respect is the kind of word everyone uses and nobody can define. Didion does it by tracing it back to a source, and she puts the definition of “character” between dashes, so the sentence pauses to explain itself. “Willingness” is the key word. It's an attitude you can choose, which means self-respect is something you can build.", "stealIt": "Reclaim a sentimentalized virtue like self-respect, loyalty, or patience. Strip away its pious associations and define it through rigorous personal accountability. Anchor the concept in concrete sacrifices rather than good intentions.", "aroundIt": "Didion wrote the essay for *Vogue* in 1961, at twenty-six, to fill a space left when another writer's piece fell through. She wrote it against a deadline, to the exact number of characters.", "verification": "Checked against published excerpts."}, {"id": "ogilvy-rolls-royce-clock", "job": "How to prove a grand claim with one quiet fact", "quote": "At 60 miles an hour the loudest noise in this new Rolls-Royce comes from the electric clock.", "author": "David Ogilvy", "work": "Rolls-Royce advertisement", "year": 1958, "translator": null, "highlights": ["At 60 miles an hour", "the loudest noise", "the electric clock"], "lookCloser": "There isn't a single adjective about luxury. No “whisper-quiet”, no “refined”. Instead there's a speed you can feel, and a tiny object you can hear in your head ticking. The headline makes you do the imagining. You p
