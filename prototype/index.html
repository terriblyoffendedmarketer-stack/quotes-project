": "Yann Martel", "work": "The Facts Behind the Helsinki Roccamatios", "year": 1993, "translator": null, "hook": "How to puncture comforting platitudes with a single obscenity.", "why_it_lands": "Martel places the hollow optimism of a medical cliche against the abrupt, monosyllabic profanity of a dying friend. The jarring typographic contrast destroys false solace on contact.", "tags": ["contrast", "brevity", "grief", "defiance"]}, {"quote": "It’s strangely moving. The earth yields to a great wedge on whose black marble walls the names of the war dead are inscribed.", "author": "Yann Martel", "work": "The Facts Behind the Helsinki Roccamatios", "year": 1993, "translator": null, "hook": "How to describe memorial architecture as an incision into the earth.", "why_it_lands": "Martel describes the Vietnam Veterans Memorial not as a monument built upward, but as a surgical wedge sliced into the ground. The earth 'yielding' gives stone the somatic vulnerability of wounded flesh.", "tags": ["imagery", "architecture", "memorial", "precision"]}, {"quote": "‘It was about a young man who falls in love with a door. When a friend finds out, he destroys the door.’", "author": "Yann Martel", "work": "The Facts Behind the Helsinki Roccamatios", "year": 1993, "translator": null, "hook": "How to craft a surreal micro-parable on jealousy.", "why_it_lands": "Two sentences of fable-like simplicity. Martel replaces romantic rivals with an inanimate threshold, distilling erotic possessiveness and violent betrayal into an unforgettable surrealist snapshot.", "tags": ["micro-fiction", "parable", "surrealism", "brevity"]}, {"quote": "‘और यह मृतक शरीर जो बचा है शेष, चुप-चुप, मानो, पूछता है मुझसे पुकार- विजय का एक उपहार मैं बचा हूँ, बोलो, जीत किसकी है और किसकी हुई है हार?’\n\n('And this corpse that remains behind, silent yet crying out: I am what remains as the prize of victory—tell me, whose is the triumph, and who has been defeated?')", "author": "Ramdhari Singh Dinkar", "work": "Kurukshetra", "year": 1946, "translator": null, "hook": "How to question the legitimacy of victory through a silent corpse.", "why_it_lands": "Dinkar gives the slain soldier the ultimate moral interrogation. The silent dead body becomes the only surviving trophy of the epic war, reducing martial triumph to a ghastly category error.", "tags": ["poetry", "moral-weight", "war", "interrogation"]}, {"quote": "‘पर शिराएँ जिस महीरुह की अतल में हैं गड़ी, वह नहीं भयभीत होता क्रूर झंझावात से।’\n\n('The tree whose roots are buried in the deep abyss does not tremble before the cruel tempest.')", "author": "Ramdhari Singh Dinkar", "work": "Kurukshetra", "year": 1946, "translator": null, "hook": "How to anchor internal resilience in deep roots.", "why_it_lands": "A timeless botanical metaphor for psychological and spiritual fortitude. Dinkar balances the violent agitation of the storm ('क्रूर झंझावात') against the profound stillness of roots embedded in the unshakeable deep ('अतल').", "tags": ["metaphor", "resilience", "poetry", "nature"]}, {"quote": "‘बताना उसे दर्शन की भ्रान्ति है। शोषण की श्रृंखला के हेतु बनती जो शान्ति, युद्ध है, यथार्थ में वो भीषण अशान्ति है;’\n\n('To call it peace is a philosophical delusion. The peace that is forged merely to preserve the chains of exploitation is, in truth, an ongoing, terrible war.')", "author": "Ramdhari Singh Dinkar", "work": "Kurukshetra", "year": 1946, "translator": null, "hook": "How to unmask institutional peace as concealed violence.", "why_it_lands": "Dinkar shatters the sanctimonious defense of social order. A peace designed to protect the mechanisms of oppression is diagnosed not as harmony, but as the quietest and most devastating form of warfare.", "tags": ["political-satire", "philosophy", "justice", "polemic"]}, {"quote": "‘अन्त नहीं नर-पंथ का, कुरुक्षेत्र की धूल, आँसू बरसें, तो यहीं खिले शान्ति का फूल।’\n\n('The dust of Kurukshetra is not the end of the human path; when tears rain down, it is right here that the flower of true peace will bloom.')", "author": "Ramdhari Singh Dinkar", "work": "Kurukshetra", "year": 1946, "translator": null, "hook": "How to transform a battlefield into ground for moral rebirth.", "why_it_lands": "Dinkar concludes the blood-soaked epic with redemption through grief. The battlefield's dust is not human finality, but soil where true peace can only sprout after being watered by tears of remorse.", "tags": ["poetry", "redemption", "hope", "metaphor"]}];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const dayNumber = Math.floor(Date.now() / 86400000);

const HOOKS = ["#2d3be8", "#d9402a", "#1f6b45", "#7a2a7a", "#0f6e74", "#bf4a17", "#c21f6e", "#5b2bd9", "#14161b"];
const LIGHT = ["#ffe9a8", "#ffd0e1", "#d2f3b0", "#dcd0ff", "#ffd6bf", "#cde7ff", "#c4f0e0", "#f2e3c6", "#ffc2b8"];
const DARK = ["#5e460c", "#571f3b", "#1f4527", "#2e2870", "#6a2e14", "#173a5e", "#0f4a44", "#4a3524", "#6b1f2a"];
const seeded = seed => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const shuffled = (n, rand) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function palette(day) {
  const order = shuffled(HOOKS.length, seeded(Math.floor(day / HOOKS.length) * 7919 + 17));
  const picks = shuffled(LIGHT.length, seeded(day * 104729 + 3)).slice(0, 4);
  if (picks[1] === 0) [picks[0], picks[1]] = [picks[1], picks[0]];
  const root = document.documentElement.style;
  root.setProperty("--s-hook", HOOKS[order[((day % HOOKS.length) + HOOKS.length) % HOOKS.length]]);
  ["line", "look", "steal", "around"].forEach((k, i) => { root.setProperty(`--l-${k}`, LIGHT[picks[i]]); root.setProperty(`--d-${k}`, DARK[picks[i]]); });
}

const todayIndex = dayNumber % (CARDS.length || 1);
let index = todayIndex;
let showSteal = store.get("showSteal", true);

const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const note = s => {
  let h = md(s);
  const m = h.slice(12).search(/[.!?]”?\s/);
  if (m >= 0) { const end = 12 + m + (h[12 + m + 1] === "”" ? 2 : 1); h = "<strong>" + h.slice(0, end) + "</strong>" + h.slice(end); }
  return h.replace(/“([^”]{1,80})”/g, '<mark class="q">“$1”</mark>');
};

function marked(card) {
  let html = esc(card.quote);
  for (const h of card.highlights || []) {
    const e = esc(h);
    const i = html.indexOf(e);
    if (i >= 0) html = html.slice(0, i) + "<mark>" + e + "</mark>" + html.slice(i + e.length);
  }
  return html;
}

function credit(item) {
  return `${esc(item.author)}, <cite>${esc(item.work)}</cite>${item.translator ? ` · trans. ${esc(item.translator)}` : ""}`;
}

/* ==========================================================================
   CARDS RENDERER
   ========================================================================== */
function renderCards() {
  if (!CARDS.length) return;
  const c = CARDS[index];
  const howTo = c.job.startsWith("How to ");
  palette(dayNumber + index - todayIndex);
  const fine = `<div class="fine">${esc(c.job)}</div>`;
  const slides = [
    { tab: "How to", cls: "hook", html: `
      ${howTo ? '<span class="pill">How to</span>' : ""}
      <h2 class="hook-title">${esc(howTo ? c.job.slice(7) : c.job)}</h2>
      <div class="hook-foot"><span>${esc(c.author)}</span><span>The line that does it →</span></div>` },
    { tab: "The line", cls: "line-s", html: `
      <div class="kicker">The line</div>
      <p class="line${c.quote.length > 180 ? " long" : ""}">“${esc(c.quote)}”</p>
      <div class="who">${credit(c)}</div>${fine}` },
    { tab: "Look closer", cls: "look", html: `
      <div class="kicker">Look closer</div>
      <p class="mini">${marked(c)}</p>
      <div class="note"><p>${note(c.lookCloser)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` }
  ];
  if (showSteal) slides.push({ tab: "Steal it", cls: "steal-s", html: `
      <div class="kicker">Steal it</div>
      <div class="note"><p>${note(c.stealIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)}</div>${fine}` });
  slides.push({ tab: "Around it", cls: "around", html: `
      <div class="kicker">Around it</div>
      <div class="note"><p>${note(c.aroundIt)}</p></div>
      <div class="who" style="margin-top:auto">${credit(c)} · ${c.year}</div>${fine}` });

  $("track").innerHTML = slides.map((s, i) => `<article class="slide ${s.cls}" aria-label="${s.tab}">${s.html}</article>`).join("");
  $("dots").innerHTML = slides.map((s, i) => `<button type="button" data-i="${i}" aria-current="${i === 0}">${s.tab}</button>`).join("");
  $("track").scrollLeft = 0;

  $("day").innerHTML = index === todayIndex ? "<b>TODAY</b>" : `CARD ${String(index + 1).padStart(2, "0")}`;
  $("count").textContent = `${index + 1} / ${CARDS.length}`;
  $("stealToggle").textContent = showSteal ? "Hide “Steal it”" : "Show “Steal it”";
  $("wPill").hidden = !howTo;
  $("wAuthor").textContent = c.author;
  $("wLine").textContent = howTo ? c.job.slice(7) : c.job;
}

/* ==========================================================================
   QUOTE BANK RENDERER
   ========================================================================== */
let bankFiltered = [...QUOTE_BANK];
let bankIndex = 0;

function initBank() {
  $("bankCountLabel").textContent = QUOTE_BANK.length;
  // Populate tags dropdown
  const tagSet = new Set();
  QUOTE_BANK.forEach(q => (q.tags || []).forEach(t => tagSet.add(t)));
  const tags = Array.from(tagSet).sort();
  $("bankTagFilter").innerHTML = `<option value="">All themes (${QUOTE_BANK.length})</option>` +
    tags.map(t => `<option value="${esc(t)}">#${esc(t)}</option>`).join("");

  renderBookshelf();
  filterBank();
}

function filterBank() {
  const selTag = $("bankTagFilter").value;
  if (!selTag) {
    bankFiltered = [...QUOTE_BANK];
  } else {
    bankFiltered = QUOTE_BANK.filter(q => (q.tags || []).includes(selTag));
  }
  bankIndex = 0;
  renderBankCard();
}

function renderBankCard() {
  if (!bankFiltered.length) {
    $("bHook").textContent = "EMPTY";
    $("bQuote").textContent = "No quotes match this filter.";
    $("bWho").textContent = "";
    $("bWhy").textContent = "";
    $("bTags").innerHTML = "";
    $("bCounter").textContent = "0 / 0";
    return;
  }
  const q = bankFiltered[bankIndex];
  $("bHook").textContent = q.hook || "Craft Job";
  $("bQuote").textContent = `“${q.quote}”`;
  $("bQuote").className = `bank-quote${q.quote.length > 180 ? " long" : ""}`;
  $("bWho").innerHTML = `${credit(q)}${q.year ? ` (${q.year})` : ""}`;
  $("bWhy").textContent = q.whyItLands || "";
  $("bTags").innerHTML = (q.tags || []).map(t => `<span class="bank-tag">#${esc(t)}</span>`).join("");
  $("bCounter").textContent = `${bankIndex + 1} of ${bankFiltered.length}`;
}

function renderBookshelf() {
  const shelf = $("bankShelfPanel");
  // Group by work
  const grouped = {};
  QUOTE_BANK.forEach(q => {
    const key = `${q.work}:::${q.author}:::${q.year || ""}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(q);
  });

  const keys = Object.keys(grouped).sort();
  shelf.innerHTML = keys.map((k, idx) => {
    const [work, author, year] = k.split(":::");
    const items = grouped[k];
    return `
      <div class="book-entry">
        <div class="book-header" onclick="toggleBook(${idx})">
          <div>
            <div class="book-title">${esc(work)}</div>
            <div class="book-author">${esc(author)}${year ? ` (${year})` : ""}</div>
          </div>
          <span class="book-badge">${items.length} quotes</span>
        </div>
        <div class="book-quotes" id="bookQ_${idx}" hidden>
          ${items.map(it => `
            <div class="book-q-item" onclick="openQuoteInShuffle('${esc(it.id)}')">
              <div class="book-q-hook">${esc(it.hook)}</div>
              <div>“${esc(it.quote.slice(0, 140))}${it.quote.length > 140 ? "..." : ""}”</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

window.toggleBook = function(idx) {
  const el = $(`bookQ_${idx}`);
  if (el) el.hidden = !el.hidden;
};

window.openQuoteInShuffle = function(id) {
  const foundIdx = bankFiltered.findIndex(q => q.id === id);
  if (foundIdx >= 0) {
    bankIndex = foundIdx;
  } else {
    $("bankTagFilter").value = "";
    filterBank();
    const allIdx = bankFiltered.findIndex(q => q.id === id);
    if (allIdx >= 0) bankIndex = allIdx;
  }
  // Switch to shuffle view
  $("bankViewShuffle").setAttribute("aria-pressed", "true");
  $("bankViewShelf").setAttribute("aria-pressed", "false");
  $("bankShufflePanel").hidden = false;
  $("bankShelfPanel").hidden = true;
  renderBankCard();
};

/* ==========================================================================
   EVENT LISTENERS
   ========================================================================== */
$("modeCards").addEventListener("click", () => {
  $("modeCards").setAttribute("aria-pressed", "true");
  $("modeBank").setAttribute("aria-pressed", "false");
  $("viewCards").hidden = false;
  $("viewBank").hidden = true;
  $("day").hidden = false;
});

$("modeBank").addEventListener("click", () => {
  $("modeCards").setAttribute("aria-pressed", "false");
  $("modeBank").setAttribute("aria-pressed", "true");
  $("viewCards").hidden = true;
  $("viewBank").hidden = false;
  $("day").hidden = true;
});

$("bankViewShuffle").addEventListener("click", () => {
  $("bankViewShuffle").setAttribute("aria-pressed", "true");
  $("bankViewShelf").setAttribute("aria-pressed", "false");
  $("bankShufflePanel").hidden = false;
  $("bankShelfPanel").hidden = true;
});

$("bankViewShelf").addEventListener("click", () => {
  $("bankViewShuffle").setAttribute("aria-pressed", "false");
  $("bankViewShelf").setAttribute("aria-pressed", "true");
  $("bankShufflePanel").hidden = true;
  $("bankShelfPanel").hidden = false;
});

$("bankTagFilter").addEventListener("change", filterBank);

$("bSurprise").addEventListener("click", () => {
  if (bankFiltered.length <= 1) return;
  let next;
  do {
    next = Math.floor(Math.random() * bankFiltered.length);
  } while (next === bankIndex);
  bankIndex = next;
  renderBankCard();
});

$("bNext").addEventListener("click", () => {
  if (!bankFiltered.length) return;
  bankIndex = (bankIndex + 1) % bankFiltered.length;
  renderBankCard();
});

$("bPrev").addEventListener("click", () => {
  if (!bankFiltered.length) return;
  bankIndex = (bankIndex - 1 + bankFiltered.length) % bankFiltered.length;
  renderBankCard();
});

// Keyboard shortcuts: Space for Surprise Me when Bank is visible
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if ($("viewBank").hidden === false && $("bankShufflePanel").hidden === false) {
    if (e.code === "Space") {
      e.preventDefault();
      $("bSurprise").click();
    } else if (e.code === "ArrowRight") {
      $("bNext").click();
    } else if (e.code === "ArrowLeft") {
      $("bPrev").click();
    }
  } else if ($("viewCards").hidden === false) {
    if (e.code === "ArrowRight") $("next").click();
    if (e.code === "ArrowLeft") $("prev").click();
  }
});

$("dots").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = $("track");
  t.scrollTo({ left: t.clientWidth * Number(b.dataset.i), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
$("track").addEventListener("scroll", () => {
  const t = $("track");
  const i = Math.round(t.scrollLeft / t.clientWidth);
  [...$("dots").children].forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
}, { passive: true });
$("prev").addEventListener("click", () => { index = (index - 1 + CARDS.length) % CARDS.length; renderCards(); });
$("next").addEventListener("click", () => { index = (index + 1) % CARDS.length; renderCards(); });
$("stealToggle").addEventListener("click", () => { showSteal = !showSteal; store.set("showSteal", showSteal); renderCards(); });
$("widget").addEventListener("click", () => { $("track").scrollLeft = 0; window.scrollTo({ top: 0, behavior: "smooth" }); });

renderCards();
initBank();
</script>
